<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hash Generator</title>
  <link rel="icon" type="image/x-icon" href="../../images.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/spark-md5/3.0.2/spark-md5.min.js"></script>
  <style>
    :root {
      --bg: #0f141f;
      --panel: #131b2a;
      --panel-2: #162238;
      --border: #253353;
      --text: #e7edf7;
      --muted: #9fb2c7;
      --accent: #7c3aed;
      --good: #34d399;
      --bad: #f87171;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
      --shadow: 0 14px 30px rgba(0,0,0,0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% -20%, rgba(124, 58, 237, 0.2), transparent 60%),
        radial-gradient(900px 500px at 90% -20%, rgba(34, 197, 94, 0.18), transparent 60%),
        var(--bg);
      min-height: 100vh;
    }
    header {
      padding: 26px 36px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(19, 27, 42, 0.95), rgba(15, 20, 31, 0.9));
      position: sticky; top: 0; z-index: 10;
    }
    header .wrap { max-width: 1100px; margin: 0 auto; }
    .back {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--muted); text-decoration: none; font-size: 12px;
      letter-spacing: 0.2em; text-transform: uppercase;
      border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px;
      font-family: var(--mono);
    }
    h1 { margin-top: 12px; font-size: clamp(1.6rem, 2.6vw, 2.4rem); }
    .sub { margin-top: 6px; color: var(--muted); }
    main { max-width: 1100px; margin: 0 auto; padding: 30px 36px 80px; display: grid; gap: 22px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .panel h2 { font-size: 1.1rem; margin-bottom: 12px; }
    textarea, input[type="text"] {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 0.85rem;
    }
    textarea { min-height: 140px; resize: vertical; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .btn {
      background: var(--accent); color: #0d0617; border: none; border-radius: 10px;
      padding: 10px 16px; font-weight: 700; cursor: pointer; font-family: var(--mono);
      text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.72rem;
    }
    .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .hash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }
    .hash-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .hash-card .label {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .hash-card .value {
      font-family: var(--mono);
      font-size: 0.82rem;
      word-break: break-all;
      margin-top: 8px;
    }
    .status {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 0.75rem;
    }
    .status.good { color: var(--good); }
    .status.bad { color: var(--bad); }
    .drop {
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      background: rgba(20, 31, 51, 0.8);
      cursor: pointer;
    }
    .drop.drag { border-color: var(--accent); background: rgba(124, 58, 237, 0.08); }
    .muted { color: var(--muted); font-size: 0.85rem; }
    @media (max-width: 640px) {
      header, main { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="back" href="../../index.html">Back Home</a>
      <h1>Hash Generator</h1>
      <p class="sub">Compute MD5, SHA-1, SHA-256, SHA-384, and SHA-512 for text or files.</p>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Text</h2>
      <textarea id="textInput" placeholder="Paste text here..."></textarea>
      <div class="hash-grid" id="textHashes"></div>
    </section>

    <section class="panel">
      <h2>File</h2>
      <div class="drop" id="fileDrop">
        <strong>Drop a file here</strong>
        <div class="muted">or click to browse</div>
        <input type="file" id="fileInput" hidden>
      </div>
      <div class="row"><span class="muted" id="fileMeta">No file selected.</span></div>
      <div class="hash-grid" id="fileHashes"></div>
    </section>

    <section class="panel">
      <h2>Verify Hash</h2>
      <div class="row">
        <input type="text" id="verifyInput" placeholder="Paste a hash to compare...">
        <select id="verifyAlgo">
          <option value="MD5">MD5</option>
          <option value="SHA-1">SHA-1</option>
          <option value="SHA-256">SHA-256</option>
          <option value="SHA-384">SHA-384</option>
          <option value="SHA-512">SHA-512</option>
        </select>
        <button class="btn secondary" id="verifyBtn">Compare</button>
      </div>
      <div id="verifyStatus" class="status"></div>
    </section>
  </main>

  <script>
    const textInput = document.getElementById('textInput');
    const textHashes = document.getElementById('textHashes');
    const fileHashes = document.getElementById('fileHashes');
    const fileDrop = document.getElementById('fileDrop');
    const fileInput = document.getElementById('fileInput');
    const fileMeta = document.getElementById('fileMeta');
    const verifyInput = document.getElementById('verifyInput');
    const verifyAlgo = document.getElementById('verifyAlgo');
    const verifyStatus = document.getElementById('verifyStatus');

    const ALGOS = ['MD5', 'SHA-1', 'SHA-256', 'SHA-384', 'SHA-512'];
    let lastTextHashes = {};
    let lastFileHashes = {};

    function toHex(buffer) {
      return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    async function hashBuffer(algo, buffer) {
      if (algo === 'MD5') {
        return SparkMD5.ArrayBuffer.hash(buffer);
      }
      const digest = await crypto.subtle.digest(algo, buffer);
      return toHex(digest);
    }
    function renderHashes(container, hashes) {
      container.innerHTML = '';
      ALGOS.forEach(algo => {
        const card = document.createElement('div');
        card.className = 'hash-card';
        card.innerHTML = `<div class="label">${algo}</div><div class="value" data-algo="${algo}">${hashes[algo] || '-'}</div>`;
        container.appendChild(card);
      });
    }
    async function computeTextHashes() {
      const text = textInput.value || '';
      const buf = new TextEncoder().encode(text).buffer;
      const out = {};
      for (const algo of ALGOS) out[algo] = await hashBuffer(algo, buf);
      lastTextHashes = out;
      renderHashes(textHashes, out);
    }
    async function computeFileHashes(file) {
      if (!file) return;
      const buf = await file.arrayBuffer();
      const out = {};
      for (const algo of ALGOS) out[algo] = await hashBuffer(algo, buf);
      lastFileHashes = out;
      renderHashes(fileHashes, out);
    }

    textInput.addEventListener('input', () => {
      computeTextHashes();
      verifyStatus.textContent = '';
    });
    computeTextHashes();

    fileDrop.addEventListener('click', () => fileInput.click());
    fileDrop.addEventListener('dragover', (e) => { e.preventDefault(); fileDrop.classList.add('drag'); });
    fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('drag'));
    fileDrop.addEventListener('drop', (e) => {
      e.preventDefault();
      fileDrop.classList.remove('drag');
      if (e.dataTransfer.files[0]) {
        fileInput.files = e.dataTransfer.files;
        handleFile();
      }
    });
    fileInput.addEventListener('change', handleFile);

    function handleFile() {
      const file = fileInput.files[0];
      if (!file) return;
      fileMeta.textContent = `${file.name} (${(file.size/1024).toFixed(1)} KB)`;
      computeFileHashes(file);
      verifyStatus.textContent = '';
    }

    document.getElementById('verifyBtn').addEventListener('click', () => {
      const target = verifyInput.value.trim().toLowerCase();
      if (!target) return;
      const algo = verifyAlgo.value;
      const source = lastFileHashes[algo] || lastTextHashes[algo] || '';
      if (!source) return;
      if (source.toLowerCase() === target) {
        verifyStatus.textContent = 'Match: hash is identical.';
        verifyStatus.className = 'status good';
      } else {
        verifyStatus.textContent = 'No match.';
        verifyStatus.className = 'status bad';
      }
    });
  </script>
</body>
</html>
