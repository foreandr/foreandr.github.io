<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Compositions</title>
  <link rel="icon" type="image/x-icon" href="../../images.ico">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="back-btn" href="../../index.html">← Back Home</a>
      <div class="title-wrap">
        <h1>Prime Compositions</h1>
        <p>Every number written as equal-part sums. A number is <em>irreducible</em> when no such grouping exists. Change the mod to redefine what "grouping" means. Pick a base to view numbers in that numeral system.</p>
      </div>
    </header>

    <div class="controls-bar">
      <div class="control-group">
        <label for="max-n-slider">Show 1 –</label>
        <input id="max-n-slider" type="range" min="10" max="500" step="10" value="100">
        <strong id="max-n-val">100</strong>
      </div>
      <button id="add-panel-btn" class="add-btn">+ Add Panel</button>
    </div>

    <div class="panels-container" id="panels-container"></div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
