<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Signature Builder</title>
  <link rel="icon" type="image/x-icon" href="../../images.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1119;
      --panel: #121a27;
      --panel-2: #182236;
      --border: #273857;
      --text: #e7edf7;
      --muted: #9fb2c7;
      --accent: #22c55e;
      --shadow: 0 14px 30px rgba(0,0,0,0.4);
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% -20%, rgba(34, 197, 94, 0.2), transparent 60%),
        radial-gradient(900px 500px at 90% -20%, rgba(59, 130, 246, 0.18), transparent 60%),
        var(--bg);
      min-height: 100vh;
    }
    header {
      padding: 26px 36px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(18, 26, 39, 0.95), rgba(11, 17, 25, 0.9));
      position: sticky; top: 0; z-index: 10;
    }
    header .wrap { max-width: 1100px; margin: 0 auto; }
    .back {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--muted); text-decoration: none; font-size: 12px;
      letter-spacing: 0.2em; text-transform: uppercase;
      border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px;
      font-family: var(--mono);
    }
    h1 { margin-top: 12px; font-size: clamp(1.7rem, 2.8vw, 2.5rem); }
    .sub { margin-top: 6px; color: var(--muted); }
    main { max-width: 1100px; margin: 0 auto; padding: 30px 36px 80px; display: grid; gap: 22px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: var(--shadow);
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    input, textarea {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 0.85rem;
    }
    textarea { min-height: 80px; resize: vertical; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .btn {
      background: var(--accent);
      color: #04140d;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
    }
    .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .preview {
      background: #ffffff;
      color: #0b1220;
      border-radius: 12px;
      padding: 16px;
      font-family: Arial, sans-serif;
    }
    .preview small { color: #6b7280; }
    @media (max-width: 640px) {
      header, main { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="back" href="../../index.html">Back Home</a>
      <h1>Email Signature Builder</h1>
      <p class="sub">Generate a clean HTML signature and copy it into Gmail/Outlook.</p>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="grid">
        <input id="name" placeholder="Full name">
        <input id="title" placeholder="Title">
        <input id="company" placeholder="Company">
        <input id="phone" placeholder="Phone">
        <input id="email" placeholder="Email">
        <input id="website" placeholder="Website">
        <input id="address" placeholder="Address">
        <input id="logo" placeholder="Logo URL (optional)">
      </div>
      <div class="row">
        <button class="btn" id="copyBtn">Copy HTML</button>
        <button class="btn secondary" id="downloadBtn">Download .html</button>
      </div>
    </section>

    <section class="panel">
      <h2>Preview</h2>
      <div class="preview" id="preview"></div>
    </section>
  </main>

  <script>
    const fields = ['name','title','company','phone','email','website','address','logo'];
    const inputs = Object.fromEntries(fields.map(id => [id, document.getElementById(id)]));
    const preview = document.getElementById('preview');

    function buildHtml() {
      const v = Object.fromEntries(fields.map(id => [id, inputs[id].value.trim()]));
      const parts = [];
      if (v.logo) {
        parts.push(`<img src="${v.logo}" alt="logo" style="height:40px;margin-bottom:8px;">`);
      }
      if (v.name) parts.push(`<div style="font-weight:700;font-size:14px;">${v.name}</div>`);
      if (v.title || v.company) parts.push(`<div style="font-size:12px;color:#4b5563;">${[v.title, v.company].filter(Boolean).join(' · ')}</div>`);
      const lines = [];
      if (v.phone) lines.push(`☎ ${v.phone}`);
      if (v.email) lines.push(`✉ ${v.email}`);
      if (v.website) lines.push(`🌐 ${v.website}`);
      if (v.address) lines.push(`📍 ${v.address}`);
      if (lines.length) parts.push(`<div style="margin-top:8px;font-size:12px;color:#374151;">${lines.join('<br>')}</div>`);
      return `<div style="font-family:Arial, sans-serif;">${parts.join('')}</div>`;
    }

    function render() { preview.innerHTML = buildHtml() || '<small>Fill in fields to generate a signature.</small>'; }
    fields.forEach(id => inputs[id].addEventListener('input', render));
    render();

    document.getElementById('copyBtn').addEventListener('click', () => {
      const html = buildHtml();
      if (!html) return;
      navigator.clipboard.writeText(html);
    });
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const html = buildHtml();
      if (!html) return;
      const a = document.createElement('a');
      a.href = 'data:text/html;charset=utf-8,' + encodeURIComponent(html);
      a.download = 'signature.html';
      a.click();
    });
  </script>
</body>
</html>
