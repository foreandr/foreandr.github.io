<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Editor</title>
  <link rel="icon" type="image/x-icon" href="../../images.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root { --bg:#0a0a0b; --bg2:#111113; --bg3:#18181b; --border:#252528; --text:#e2e2e6; --muted:#6b6b72; --accent:#c8a96e; --green:#5aab7a; --red:#e05555; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background:var(--bg); color:var(--text); font-family:'Crimson Pro',Georgia,serif; font-size:17px; line-height:1.6; min-height:100vh; display:flex; flex-direction:column; }

header {
  background: linear-gradient(135deg, #0a0a0b 0%, #111113 40%, #18181b 100%);
  border-bottom: 1px solid var(--border);
  padding: 2.5rem 2rem 2rem;
  text-align: center;
  position: relative;
  flex-shrink: 0;
}
.back-btn {
  position: absolute; top: 1.5rem; left: 1.5rem;
  color: var(--muted); text-decoration: none;
  font-family: 'Crimson Pro', serif; font-size: 15px;
  border: 1px solid var(--border); padding: 0.4rem 0.9rem;
  border-radius: 4px; transition: color 0.2s, border-color 0.2s;
}
.back-btn:hover { color: var(--accent); border-color: var(--accent); }
.eyebrow {
  font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent);
  margin-bottom: 0.5rem;
}
header h1 {
  font-family: 'Cinzel', serif; font-weight: 700; font-size: clamp(1.8rem, 4vw, 2.8rem);
  background: linear-gradient(135deg, var(--accent) 0%, #e8c98e 50%, var(--accent) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  letter-spacing: 0.05em; margin-bottom: 0.5rem;
}
header p { color: var(--muted); font-size: 15px; max-width: 560px; margin: 0 auto; }

.editor-container {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}

.toolbar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 0.5rem 1rem; display: flex; flex-wrap: wrap; gap: 0.25rem;
  align-items: center; flex-shrink: 0;
}
.tb-btn {
  font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500;
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--muted); padding: 0.3rem 0.6rem; border-radius: 4px;
  cursor: pointer; transition: color 0.2s, border-color 0.2s, background 0.2s;
  white-space: nowrap;
}
.tb-btn:hover { color: var(--accent); border-color: var(--accent); background: rgba(200,169,110,0.06); }
.tb-sep { width: 1px; height: 22px; background: var(--border); margin: 0 0.2rem; }

.action-btns {
  margin-left: auto; display: flex; gap: 0.4rem; flex-wrap: wrap;
}
.action-btn {
  font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600; letter-spacing: 0.07em;
  padding: 0.3rem 0.75rem; border-radius: 4px; border: none; cursor: pointer;
  transition: opacity 0.2s;
}
.action-btn:hover { opacity: 0.82; }
.ab-primary { background: var(--accent); color: #0a0a0b; }
.ab-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.ab-secondary:hover { color: var(--accent); border-color: var(--accent); }

.split-pane {
  flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden;
}

.pane {
  display: flex; flex-direction: column; overflow: hidden;
  border-right: 1px solid var(--border);
}
.pane:last-child { border-right: none; }
.pane-header {
  font-family: 'Cinzel', serif; font-size: 11px; font-weight: 600;
  letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted);
  padding: 0.5rem 1rem; background: var(--bg2); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

#editor {
  flex: 1; resize: none; border: none; outline: none;
  background: var(--bg); color: var(--text);
  font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.7;
  padding: 1.25rem 1.5rem; overflow-y: auto; tab-size: 2;
}

#preview {
  flex: 1; overflow-y: auto; padding: 1.5rem 2rem;
  background: var(--bg);
}

/* Preview markdown styles */
#preview h1,#preview h2,#preview h3,#preview h4,#preview h5,#preview h6 {
  font-family: 'Cinzel', serif; font-weight: 600;
  color: var(--accent); margin: 1.5rem 0 0.75rem; line-height: 1.3;
}
#preview h1 { font-size: 1.9em; border-bottom: 1px solid var(--border); padding-bottom: 0.4rem; }
#preview h2 { font-size: 1.5em; }
#preview h3 { font-size: 1.2em; }
#preview p { margin: 0 0 1rem; }
#preview a { color: var(--accent); }
#preview strong { color: var(--text); font-weight: 600; }
#preview em { font-style: italic; }
#preview ul, #preview ol { margin: 0 0 1rem 1.5rem; }
#preview li { margin-bottom: 0.25rem; }
#preview blockquote {
  border-left: 3px solid var(--accent); margin: 1rem 0;
  padding: 0.5rem 1rem; background: var(--bg2); color: var(--muted);
  font-style: italic; border-radius: 0 4px 4px 0;
}
#preview code {
  font-family: 'JetBrains Mono', monospace; font-size: 0.85em;
  background: var(--bg3); border: 1px solid var(--border);
  padding: 0.15em 0.4em; border-radius: 3px; color: #c8a96e;
}
#preview pre {
  background: #0d1117; border: 1px solid var(--border); border-radius: 6px;
  padding: 1rem 1.25rem; overflow-x: auto; margin: 1rem 0;
}
#preview pre code {
  background: none; border: none; padding: 0; color: inherit; font-size: 13px;
}
#preview table {
  width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 15px;
}
#preview th {
  font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--accent);
  border-bottom: 2px solid var(--accent); padding: 0.6rem 0.8rem; text-align: left;
}
#preview td {
  border-bottom: 1px solid var(--border); padding: 0.55rem 0.8rem;
}
#preview tr:hover td { background: var(--bg2); }
#preview hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
#preview img { max-width: 100%; border-radius: 4px; }

.editor-footer {
  background: var(--bg2); border-top: 1px solid var(--border);
  padding: 0.4rem 1.5rem; display: flex; gap: 2rem; flex-shrink: 0;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted);
  flex-wrap: wrap;
}
.stat-item span { color: var(--text); }

footer { text-align:center; padding:1rem; color:var(--muted); font-size:13px; border-top:1px solid var(--border); flex-shrink:0; }

@media (max-width: 720px) {
  .split-pane { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .action-btns { margin-left: 0; }
}
</style>
</head>
<body>

<header>
  <a href="../../index.html" class="back-btn">← Back Home</a>
  <div class="eyebrow">Office</div>
  <h1>Markdown Editor</h1>
  <p>Write Markdown and see the rendered preview live — export to HTML or print.</p>
</header>

<div class="editor-container">
  <div class="toolbar">
    <button class="tb-btn" title="Bold" onclick="wrap('**','**')"><b>B</b></button>
    <button class="tb-btn" title="Italic" onclick="wrap('*','*')"><i>I</i></button>
    <button class="tb-btn" title="Heading" onclick="insertLine('## ')">H</button>
    <button class="tb-btn" title="Link" onclick="insertLink()">[L]</button>
    <button class="tb-btn" title="Image" onclick="insertImage()">IMG</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" title="Inline Code" onclick="wrap('`','`')">` `</button>
    <button class="tb-btn" title="Code Block" onclick="insertCodeBlock()">```</button>
    <button class="tb-btn" title="Blockquote" onclick="insertLine('> ')">❝</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" title="Bullet List" onclick="insertLine('- ')">• List</button>
    <button class="tb-btn" title="Numbered List" onclick="insertLine('1. ')">1. List</button>
    <button class="tb-btn" title="Horizontal Rule" onclick="insertBlock('\n---\n')">—</button>
    <button class="tb-btn" title="Table" onclick="insertTable()">Table</button>
    <div class="tb-sep"></div>
    <div class="action-btns">
      <button class="action-btn ab-secondary" onclick="copyHTML()">Copy HTML</button>
      <button class="action-btn ab-secondary" onclick="downloadMD()">↓ .md</button>
      <button class="action-btn ab-secondary" onclick="downloadHTML()">↓ HTML</button>
      <button class="action-btn ab-primary" onclick="window.print()">Print</button>
    </div>
  </div>

  <div class="split-pane">
    <div class="pane">
      <div class="pane-header">Markdown</div>
      <textarea id="editor" spellcheck="false"></textarea>
    </div>
    <div class="pane">
      <div class="pane-header">Preview</div>
      <div id="preview"></div>
    </div>
  </div>

  <div class="editor-footer">
    <div class="stat-item">Words: <span id="stat-words">0</span></div>
    <div class="stat-item">Characters: <span id="stat-chars">0</span></div>
    <div class="stat-item">Lines: <span id="stat-lines">0</span></div>
    <div class="stat-item">Reading time: <span id="stat-read">0 min</span></div>
  </div>
</div>

<footer>Markdown Editor &mdash; all processing is local, nothing is uploaded.</footer>

<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('preview');

marked.setOptions({
  highlight: null,
  gfm: true,
  breaks: false
});

const renderer = new marked.Renderer();
marked.use({ renderer });

function renderPreview() {
  const raw = editor.value;
  let html = marked.parse(raw);
  preview.innerHTML = html;
  preview.querySelectorAll('pre code').forEach(block => {
    hljs.highlightElement(block);
  });
  updateStats();
}

function updateStats() {
  const text = editor.value;
  const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
  const chars = text.length;
  const lines = text === '' ? 0 : text.split('\n').length;
  const readMin = Math.max(1, Math.ceil(words / 238));
  document.getElementById('stat-words').textContent = words.toLocaleString();
  document.getElementById('stat-chars').textContent = chars.toLocaleString();
  document.getElementById('stat-lines').textContent = lines.toLocaleString();
  document.getElementById('stat-read').textContent = readMin + ' min';
}

let debounce = null;
editor.addEventListener('input', () => {
  clearTimeout(debounce);
  debounce = setTimeout(renderPreview, 150);
});

// Toolbar helpers
function wrap(before, after) {
  const start = editor.selectionStart, end = editor.selectionEnd;
  const sel = editor.value.substring(start, end);
  const replacement = before + (sel || 'text') + after;
  editor.setRangeText(replacement, start, end, 'select');
  editor.focus();
  renderPreview();
}

function insertLine(prefix) {
  const start = editor.selectionStart;
  const val = editor.value;
  const lineStart = val.lastIndexOf('\n', start - 1) + 1;
  const lineEnd = val.indexOf('\n', start);
  const end = lineEnd === -1 ? val.length : lineEnd;
  const line = val.substring(lineStart, end);
  const newLine = prefix + (line || 'text');
  editor.setRangeText(newLine, lineStart, end, 'end');
  editor.focus();
  renderPreview();
}

function insertBlock(text) {
  const start = editor.selectionStart;
  editor.setRangeText(text, start, editor.selectionEnd, 'end');
  editor.focus();
  renderPreview();
}

function insertLink() {
  const start = editor.selectionStart, end = editor.selectionEnd;
  const sel = editor.value.substring(start, end) || 'Link text';
  editor.setRangeText('[' + sel + '](https://example.com)', start, end, 'end');
  editor.focus();
  renderPreview();
}

function insertImage() {
  const start = editor.selectionStart, end = editor.selectionEnd;
  editor.setRangeText('![Alt text](https://example.com/image.png)', start, end, 'end');
  editor.focus();
  renderPreview();
}

function insertCodeBlock() {
  const start = editor.selectionStart, end = editor.selectionEnd;
  const sel = editor.value.substring(start, end) || 'code here';
  editor.setRangeText('```\n' + sel + '\n```', start, end, 'end');
  editor.focus();
  renderPreview();
}

function insertTable() {
  const tbl = '\n| Column 1 | Column 2 | Column 3 |\n| --- | --- | --- |\n| Cell | Cell | Cell |\n| Cell | Cell | Cell |\n';
  const start = editor.selectionStart;
  editor.setRangeText(tbl, start, editor.selectionEnd, 'end');
  editor.focus();
  renderPreview();
}

function copyHTML() {
  const html = marked.parse(editor.value);
  navigator.clipboard.writeText(html).then(() => {
    const btn = [...document.querySelectorAll('.action-btn')].find(b => b.textContent === 'Copy HTML');
    if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy HTML', 1500); }
  });
}

function downloadMD() {
  const blob = new Blob([editor.value], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'document.md';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function downloadHTML() {
  const body = marked.parse(editor.value);
  const full = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<style>
body { font-family: Georgia, serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.7; color: #222; }
h1,h2,h3 { color: #111; } code { background: #f4f4f4; padding: 0.2em 0.4em; border-radius: 3px; }
pre { background: #f4f4f4; padding: 1rem; border-radius: 4px; overflow-x: auto; }
blockquote { border-left: 3px solid #ccc; margin: 1rem 0; padding: 0.5rem 1rem; color: #666; }
table { border-collapse: collapse; width: 100%; } th,td { border: 1px solid #ddd; padding: 0.6rem 0.8rem; }
</style>
</head>
<body>${body}</body>
</html>`;
  const blob = new Blob([full], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'document.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// Default content
const defaultMD = `# Welcome to the Markdown Editor

This is a **live preview** editor. Type on the left, see the result on the right.

## Features

- *Italic*, **bold**, and \`inline code\`
- Tables, blockquotes, code blocks
- Export to HTML or Markdown

## Code Example

\`\`\`javascript
function greet(name) {
  return \`Hello, \${name}!\`;
}

console.log(greet("World"));
\`\`\`

## A Table

| Language   | Paradigm      | Year |
| ---------- | ------------- | ---- |
| JavaScript | Multi-paradigm | 1995 |
| Python     | Multi-paradigm | 1991 |
| Haskell    | Functional    | 1990 |
| Rust       | Systems       | 2010 |

## Blockquote

> "The best way to predict the future is to invent it."
> — Alan Kay

## Task List

- [x] Build the editor
- [x] Add syntax highlighting
- [ ] Rule the world

---

*Made with the Markdown Editor.*
`;

editor.value = defaultMD;
renderPreview();
</script>
</body>
</html>
