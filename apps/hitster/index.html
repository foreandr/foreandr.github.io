<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HITSTER — Music Timeline Game</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090f;--s1:#10111c;--s2:#181928;--border:#252640;
  --text:#f0f0ff;--dim:#7878aa;--dimmer:#404060;
  --accent:#ff3366;--accent2:#33aaff;--gold:#ffcc00;
  --green:#00cc66;--chip:#ff9900;--purple:#aa44ff;
}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;overflow:hidden}

/* ── SCREENS ── */
.screen{display:none;flex-direction:column;height:100%}
.screen.active{display:flex}

/* ══════════════════════════════════════
   SETUP SCREEN
══════════════════════════════════════ */
#setup{align-items:center;justify-content:center;gap:0;overflow-y:auto;padding:30px 20px}
.logo{font-size:52px;font-weight:900;letter-spacing:6px;text-transform:uppercase;
      background:linear-gradient(135deg,var(--accent),var(--purple),var(--accent2));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;margin-bottom:4px}
.logo-sub{color:var(--dim);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:36px}
.setup-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;
            padding:28px 32px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:22px}
.setup-section{display:flex;flex-direction:column;gap:10px}
.setup-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);font-weight:600}
.stepper{display:flex;align-items:center;gap:0;background:var(--s2);border:1px solid var(--border);
         border-radius:8px;overflow:hidden;width:140px}
.stepper button{background:none;border:none;color:var(--text);font-size:20px;
                width:40px;height:40px;cursor:pointer;transition:background .15s}
.stepper button:hover{background:var(--border)}
.stepper span{flex:1;text-align:center;font-size:18px;font-weight:700}
.players-list{display:flex;flex-direction:column;gap:8px}
.player-row{display:flex;align-items:center;gap:10px}
.player-color{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.player-name-input{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:8px;
                   padding:9px 14px;color:var(--text);font-size:15px;font-family:inherit;outline:none;
                   transition:border-color .15s}
.player-name-input:focus{border-color:var(--accent2)}
.remove-player{background:none;border:none;color:var(--dimmer);font-size:18px;cursor:pointer;
               padding:4px 8px;border-radius:6px;transition:all .15s}
.remove-player:hover{color:var(--accent);background:rgba(255,51,102,.1)}
.add-player-btn{background:none;border:1px dashed var(--border);border-radius:8px;
                color:var(--dim);padding:9px;font-size:13px;cursor:pointer;letter-spacing:1px;
                transition:all .15s;font-family:inherit}
.add-player-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.setup-row{display:flex;gap:24px;flex-wrap:wrap}
.setup-field{display:flex;flex-direction:column;gap:8px;flex:1;min-width:140px}
.start-btn{background:linear-gradient(135deg,var(--accent),var(--purple));
           border:none;border-radius:10px;color:#fff;font-size:18px;font-weight:800;
           padding:15px;cursor:pointer;letter-spacing:2px;text-transform:uppercase;
           transition:opacity .15s;font-family:inherit}
.start-btn:hover{opacity:.85}

/* ══════════════════════════════════════
   GAME SCREEN
══════════════════════════════════════ */
#game{flex-direction:column;overflow:hidden}

/* header bar */
.g-header{background:var(--s1);border-bottom:1px solid var(--border);
          padding:8px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.g-logo{font-size:18px;font-weight:900;letter-spacing:3px;
        background:linear-gradient(90deg,var(--accent),var(--purple));
        -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.turn-badge{background:var(--s2);border:1px solid var(--border);border-radius:20px;
            padding:4px 14px;font-size:12px;color:var(--dim);letter-spacing:1px}
.turn-badge b{letter-spacing:1px}
.g-header-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.reset-btn{background:none;border:1px solid var(--border);border-radius:6px;
           color:var(--dim);font-size:11px;padding:5px 12px;cursor:pointer;
           letter-spacing:1px;font-family:inherit;transition:all .15s}
.reset-btn:hover{border-color:var(--accent);color:var(--accent)}

/* players strip */
.players-strip{display:flex;gap:0;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.player-chip{display:flex;align-items:center;gap:8px;padding:10px 18px;
             border-right:1px solid var(--border);min-width:140px;
             transition:background .15s;position:relative;flex-shrink:0}
.player-chip.active-turn{background:var(--s2)}
.player-chip.active-turn::after{content:'';position:absolute;bottom:0;left:0;right:0;
                                 height:2px;background:var(--accent)}
.pc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pc-name{font-size:13px;font-weight:600;white-space:nowrap}
.pc-score{font-size:20px;font-weight:900;margin-left:auto;min-width:24px;text-align:right}
.pc-chips{display:flex;gap:2px;margin-left:6px}
.pc-chip-icon{font-size:13px}

/* main game area */
.g-main{flex:1;display:flex;overflow:hidden}

/* center column */
.g-center{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:14px 16px;gap:12px}

/* song card */
.song-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;
           overflow:hidden;flex-shrink:0}
.song-card-top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.round-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--dim)}
.song-mystery{font-size:22px;font-weight:900;color:var(--accent);letter-spacing:2px}
.yt-wrap{position:relative;background:#000;flex-shrink:0}
.yt-cover{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;
          justify-content:center;flex-direction:column;gap:8px;z-index:5;cursor:pointer;
          transition:opacity .3s}
.yt-cover.hidden{opacity:0;pointer-events:none}
.yt-cover-icon{font-size:52px}
.yt-cover-text{font-size:12px;color:var(--dim);letter-spacing:2px;text-transform:uppercase}
#yt-player{width:100%;height:200px;display:block}

/* phase UI */
.phase-ui{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px}

/* timeline placement */
.timeline-section{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.timeline-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin-bottom:12px}
.timeline-row{display:flex;align-items:center;gap:0;overflow-x:auto;padding-bottom:4px}
.tl-gap{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 3px}
.tl-gap-btn{background:var(--s2);border:1px dashed var(--border);border-radius:8px;
            padding:7px 10px;font-size:11px;color:var(--dim);cursor:pointer;white-space:nowrap;
            transition:all .2s;font-family:inherit;letter-spacing:.5px}
.tl-gap-btn:hover,.tl-gap-btn:focus{background:rgba(51,170,255,.15);border-color:var(--accent2);
                                     color:var(--accent2);outline:none}
.tl-card{background:var(--s2);border:1px solid var(--border);border-radius:8px;
         padding:8px 12px;text-align:center;min-width:90px;flex-shrink:0}
.tl-card-year{font-size:18px;font-weight:900;letter-spacing:1px}
.tl-card-title{font-size:9px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.tl-card-artist{font-size:9px;color:var(--dimmer);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.tl-empty{color:var(--dimmer);font-size:12px;font-style:italic;padding:8px 0}

/* artist bonus */
.bonus-section{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.bonus-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);margin-bottom:10px}
.bonus-desc{font-size:12px;color:var(--dim);margin-bottom:10px}
.bonus-row{display:flex;gap:8px}
.bonus-input{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:8px;
             padding:9px 14px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
.bonus-input:focus{border-color:var(--gold)}
.bonus-btn{background:rgba(255,204,0,.12);border:1px solid var(--gold);border-radius:8px;
           color:var(--gold);font-size:12px;padding:0 16px;cursor:pointer;font-family:inherit;
           letter-spacing:1px;font-weight:600;transition:all .15s;white-space:nowrap}
.bonus-btn:hover{background:rgba(255,204,0,.25)}

/* steal section */
.steal-section{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.steal-title{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--chip);margin-bottom:10px}
.steal-desc{font-size:12px;color:var(--dim);margin-bottom:12px}
.steal-players{display:flex;flex-wrap:wrap;gap:8px}
.steal-player-btn{display:flex;align-items:center;gap:8px;background:var(--s2);
                  border:1px solid var(--border);border-radius:10px;padding:10px 16px;
                  cursor:pointer;transition:all .2s;font-family:inherit;color:var(--text)}
.steal-player-btn:hover:not(:disabled){border-color:var(--chip);background:rgba(255,153,0,.1)}
.steal-player-btn:disabled{opacity:.35;cursor:not-allowed}
.steal-btn-name{font-size:13px;font-weight:600}
.steal-btn-chips{font-size:11px;color:var(--chip)}

/* steal guess row */
.steal-guess-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.steal-year-input{background:var(--s2);border:1px solid var(--border);border-radius:8px;
                  padding:9px 14px;color:var(--text);font-size:16px;font-family:inherit;
                  outline:none;width:100px;transition:border-color .15s}
.steal-year-input:focus{border-color:var(--chip)}
.steal-submit-btn{background:rgba(255,153,0,.15);border:1px solid var(--chip);border-radius:8px;
                  color:var(--chip);font-size:13px;padding:9px 18px;cursor:pointer;
                  font-family:inherit;font-weight:700;letter-spacing:1px;transition:all .15s}
.steal-submit-btn:hover{background:rgba(255,153,0,.3)}
.steal-cancel-btn{background:none;border:1px solid var(--border);border-radius:8px;
                  color:var(--dim);font-size:12px;padding:9px 14px;cursor:pointer;
                  font-family:inherit;transition:all .15s}
.steal-cancel-btn:hover{border-color:var(--accent);color:var(--accent)}

/* result overlay */
.result-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;
                display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.result-card{background:var(--s1);border:1px solid var(--border);border-radius:20px;
             padding:36px 44px;max-width:420px;width:90%;text-align:center;
             display:flex;flex-direction:column;align-items:center;gap:16px}
.result-icon{font-size:60px}
.result-title{font-size:28px;font-weight:900;letter-spacing:2px}
.result-title.right{color:var(--green)}
.result-title.wrong{color:var(--accent)}
.result-title.steal{color:var(--chip)}
.result-song{font-size:15px;color:var(--text)}
.result-song b{font-size:18px}
.result-year{font-size:36px;font-weight:900;letter-spacing:2px}
.result-detail{font-size:13px;color:var(--dim);line-height:1.7}
.result-next-btn{background:linear-gradient(135deg,var(--accent2),var(--purple));
                 border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:800;
                 padding:13px 32px;cursor:pointer;letter-spacing:2px;text-transform:uppercase;
                 font-family:inherit;transition:opacity .15s;margin-top:8px}
.result-next-btn:hover{opacity:.85}

/* right panel — all players' timelines */
.g-right{width:280px;border-left:1px solid var(--border);overflow-y:auto;
         flex-shrink:0;display:flex;flex-direction:column;background:var(--s1)}
.g-right-title{padding:10px 14px;font-size:10px;text-transform:uppercase;letter-spacing:2px;
               color:var(--dim);border-bottom:1px solid var(--border);flex-shrink:0}
.mini-player{padding:12px 14px;border-bottom:1px solid var(--border)}
.mini-player-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mini-dot{width:8px;height:8px;border-radius:50%}
.mini-name{font-size:12px;font-weight:600}
.mini-score{margin-left:auto;font-size:12px;font-weight:700;color:var(--dim)}
.mini-chips{display:flex;gap:2px;font-size:11px}
.mini-timeline{display:flex;flex-wrap:wrap;gap:4px}
.mini-card{background:var(--s2);border:1px solid var(--border);border-radius:5px;
           padding:3px 8px;font-size:10px;font-weight:700;white-space:nowrap}
.mini-empty{font-size:10px;color:var(--dimmer);font-style:italic}

/* ══════════════════════════════════════
   WIN SCREEN
══════════════════════════════════════ */
#win{align-items:center;justify-content:center;text-align:center;gap:20px;padding:40px 20px}
.win-title{font-size:48px;font-weight:900;letter-spacing:4px;text-transform:uppercase;
           background:linear-gradient(135deg,var(--gold),var(--accent),var(--purple));
           -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.win-winner{font-size:28px;font-weight:700}
.win-timeline{background:var(--s1);border:1px solid var(--border);border-radius:16px;
              padding:24px 32px;max-width:600px;width:100%}
.win-timeline h3{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin-bottom:16px}
.win-cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.win-card{background:var(--s2);border:1px solid var(--border);border-radius:8px;
          padding:8px 14px;text-align:center;min-width:100px}
.win-card-year{font-size:20px;font-weight:900}
.win-card-info{font-size:9px;color:var(--dim);margin-top:2px}
.win-scoreboard{background:var(--s1);border:1px solid var(--border);border-radius:16px;
                padding:20px 28px;max-width:400px;width:100%}
.win-scoreboard h3{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:var(--dim);margin-bottom:14px}
.win-score-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border)}
.win-score-row:last-child{border-bottom:none}
.win-score-dot{width:10px;height:10px;border-radius:50%}
.win-score-name{font-size:14px;font-weight:600;flex:1}
.win-score-val{font-size:20px;font-weight:900}
.play-again-btn{background:linear-gradient(135deg,var(--accent),var(--purple));
                border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:800;
                padding:14px 40px;cursor:pointer;letter-spacing:2px;text-transform:uppercase;
                font-family:inherit;transition:opacity .15s}
.play-again-btn:hover{opacity:.85}
</style>
</head>
<body>

<!-- ═══════════════════ SETUP SCREEN ═══════════════════ -->
<div class="screen active" id="setup">
  <div class="logo">HITSTER</div>
  <div class="logo-sub">The Music Timeline Game</div>

  <div class="setup-card">
    <div class="setup-section">
      <div class="setup-label">Players</div>
      <div class="players-list" id="players-list"></div>
      <button class="add-player-btn" onclick="addPlayerRow()">＋ Add Player</button>
    </div>

    <div class="setup-row">
      <div class="setup-field">
        <div class="setup-label">Starting Chips 🪙</div>
        <div class="stepper">
          <button onclick="adj('chips',-1)">−</button>
          <span id="chips-val">3</span>
          <button onclick="adj('chips',1)">＋</button>
        </div>
      </div>
      <div class="setup-field">
        <div class="setup-label">Cards to Win 🏆</div>
        <div class="stepper">
          <button onclick="adj('win',-1)">−</button>
          <span id="win-val">10</span>
          <button onclick="adj('win',1)">＋</button>
        </div>
      </div>
    </div>

    <button class="start-btn" onclick="startGame()">▶ START GAME</button>
  </div>
</div>

<!-- ═══════════════════ GAME SCREEN ═══════════════════ -->
<div class="screen" id="game">
  <div class="g-header">
    <div class="g-logo">HITSTER</div>
    <div class="turn-badge" id="turn-badge">Round 1</div>
    <div class="g-header-right">
      <button class="reset-btn" onclick="goSetup()">↺ New Game</button>
    </div>
  </div>

  <div class="players-strip" id="players-strip"></div>

  <div class="g-main">
    <div class="g-center">
      <div class="song-card">
        <div class="song-card-top">
          <div>
            <div class="round-label" id="round-label">Card</div>
            <div class="song-mystery">🎵 ???</div>
          </div>
        </div>
        <div class="yt-wrap">
          <div class="yt-cover" id="yt-cover" onclick="revealSong()">
            <div class="yt-cover-icon">▶️</div>
            <div class="yt-cover-text">Tap to reveal &amp; play song</div>
          </div>
          <iframe id="yt-iframe"
            src="about:blank"
            width="100%" height="200" frameborder="0"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen
            style="display:block"></iframe>
          <div id="yt-fallback" style="display:none;padding:8px 16px;background:#0a0f1e;
               border-top:1px solid var(--border);font-size:12px;color:var(--dim)">
            Video not loading?
            <a id="yt-link" href="#" target="_blank" rel="noopener"
               style="color:var(--accent2);margin-left:6px">Open on YouTube ↗</a>
            &nbsp;·&nbsp;
            <button onclick="skipSong()" style="background:none;border:none;color:var(--dim);
                    cursor:pointer;font-size:12px;font-family:inherit;text-decoration:underline">Skip song</button>
          </div>
        </div>
      </div>

      <div class="phase-ui" id="phase-ui"></div>
    </div>

    <div class="g-right">
      <div class="g-right-title">All Timelines</div>
      <div id="all-timelines"></div>
    </div>
  </div>
</div>

<!-- ═══════════════════ WIN SCREEN ═══════════════════ -->
<div class="screen" id="win">
  <div style="font-size:72px">🏆</div>
  <div class="win-title">WINNER!</div>
  <div class="win-winner" id="win-winner-name"></div>
  <div class="win-timeline" id="win-timeline-box">
    <h3>Winning Timeline</h3>
    <div class="win-cards" id="win-cards"></div>
  </div>
  <div class="win-scoreboard" id="win-scoreboard"></div>
  <button class="play-again-btn" onclick="goSetup()">▶ Play Again</button>
</div>

<!-- ═══════════════════ RESULT OVERLAY ═══════════════════ -->
<div class="result-overlay" id="result-overlay" style="display:none">
  <div class="result-card">
    <div class="result-icon" id="res-icon"></div>
    <div class="result-title" id="res-title"></div>
    <div class="result-song" id="res-song"></div>
    <div class="result-year" id="res-year"></div>
    <div class="result-detail" id="res-detail"></div>
    <button class="result-next-btn" id="res-next-btn" onclick="dismissResult()">Next Turn →</button>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════
// PLAYER COLORS
// ═══════════════════════════════════════════════════
const COLORS = ['#ff3366','#33aaff','#ffcc00','#00cc66','#aa44ff','#ff9900'];
const DEFAULT_NAMES = ['Alice','Bob','Charlie','Dana','Eve','Frank'];

// ═══════════════════════════════════════════════════
// SETUP STATE
// ═══════════════════════════════════════════════════
let setupChips = 3;
let setupWin   = 10;
let playerRows = [];

function adj(key, delta){
  if(key==='chips'){ setupChips=Math.max(1,Math.min(10,setupChips+delta)); document.getElementById('chips-val').textContent=setupChips; }
  if(key==='win'){   setupWin  =Math.max(3,Math.min(20,setupWin  +delta)); document.getElementById('win-val')  .textContent=setupWin;   }
}

function addPlayerRow(name=''){
  if(playerRows.length>=6) return;
  const idx=playerRows.length;
  const id='pname-'+idx;
  const row={id,idx};
  playerRows.push(row);
  const div=document.createElement('div');
  div.className='player-row';
  div.id='pr-'+idx;
  div.innerHTML=`
    <div class="player-color" style="background:${COLORS[idx]}"></div>
    <input class="player-name-input" id="${id}" placeholder="${DEFAULT_NAMES[idx]||'Player '+(idx+1)}"
           value="${name}" maxlength="20">
    <button class="remove-player" onclick="removePlayerRow(${idx})" title="Remove">✕</button>`;
  document.getElementById('players-list').appendChild(div);
}

function removePlayerRow(idx){
  if(playerRows.length<=2) return;
  playerRows=playerRows.filter(r=>r.idx!==idx);
  rebuildPlayerList();
}

function rebuildPlayerList(){
  const names=[];
  playerRows.forEach(r=>{ const el=document.getElementById(r.id); if(el) names.push(el.value); });
  playerRows=[];
  document.getElementById('players-list').innerHTML='';
  names.forEach((n,i)=>addPlayerRow(n));
}

// ═══════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════
let G = {};

function startGame(){
  // collect players
  const players=[];
  for(let i=0;i<playerRows.length;i++){
    const el=document.getElementById(playerRows[i].id);
    const name=(el?.value.trim())||DEFAULT_NAMES[i]||('Player '+(i+1));
    players.push({name,color:COLORS[i],chips:setupChips,timeline:[],score:0});
  }
  if(players.length<2){ alert('Need at least 2 players!'); return; }

  // shuffle deck
  const deck=[...SONGS].sort(()=>Math.random()-.5);

  G={
    players,
    deck,
    deckIdx:0,
    currentPlayer:0,
    currentSong:null,
    phase:'waiting',   // waiting | guessing | steal_phase | bonus
    cardsToWin:setupWin,
    startChips:setupChips,
    round:1,
    stealActive:null,  // {playerIdx} during steal attempt
    revealed:false,
  };

  showScreen('game');
  renderPlayersStrip();
  renderAllTimelines();
  nextTurn();
}

function drawSong(){
  if(G.deckIdx>=G.deck.length){ G.deck=[...SONGS].sort(()=>Math.random()-.5); G.deckIdx=0; }
  return G.deck[G.deckIdx++];
}

function nextTurn(){
  G.currentSong=drawSong();
  G.phase='waiting';
  G.revealed=false;
  G.stealActive=null;

  document.getElementById('yt-cover').classList.remove('hidden');
  document.getElementById('round-label').textContent=`Round ${G.round} — ${G.players[G.currentPlayer].name}'s Turn`;
  document.getElementById('turn-badge').innerHTML=`Round <b>${G.round}</b>`;

  stopYtIframe();

  renderPlayersStrip();
  renderAllTimelines();
  renderPhaseUI();
}

// ═══════════════════════════════════════════════════
// YOUTUBE — plain iframe, no API needed
// ═══════════════════════════════════════════════════
function revealSong(){
  if(!G.currentSong) return;
  document.getElementById('yt-cover').classList.add('hidden');
  G.revealed=true;
  G.phase='guessing';
  loadYtIframe(G.currentSong.id);
  renderPhaseUI();
}

function loadYtIframe(videoId){
  const iframe=document.getElementById('yt-iframe');
  iframe.src=`https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
  // show fallback link after 4s in case video is blocked/unavailable
  const fb=document.getElementById('yt-fallback');
  const lnk=document.getElementById('yt-link');
  fb.style.display='none';
  lnk.href=`https://www.youtube.com/watch?v=${videoId}`;
  clearTimeout(window._ytFallbackTimer);
  window._ytFallbackTimer=setTimeout(()=>{ fb.style.display='block'; },4000);
}

function stopYtIframe(){
  const iframe=document.getElementById('yt-iframe');
  iframe.src='about:blank';
  clearTimeout(window._ytFallbackTimer);
  document.getElementById('yt-fallback').style.display='none';
}

function skipSong(){
  stopYtIframe();
  G.currentSong=drawSong();
  loadYtIframe(G.currentSong.id);
}

// ═══════════════════════════════════════════════════

}

function renderPhaseUI(){
  const ui=document.getElementById('phase-ui');
  const p=G.players[G.currentPlayer];

  if(G.phase==='waiting'){
    ui.innerHTML=`
      <div class="timeline-section">
        <div class="timeline-title">${esc(p.name)}'s Timeline</div>
        <div style="color:var(--dim);font-size:13px;text-align:center;padding:20px 0">
          Press the card above to reveal the song, then place it in your timeline.
        </div>
      </div>`;
    renderStealButtons(ui, false);

  }

    ui.innerHTML=`
      <div class="timeline-section">
        <div class="timeline-title">${esc(p.name)} — place this song in your timeline</div>
        ${renderTimelineGaps(G.currentPlayer)}
      </div>`;
    renderStealButtons(ui, true);
    return;
  }

  if(G.phase==='steal_phase'){
    const stealing=G.players[G.stealActive];
    ui.innerHTML=`
      <div class="steal-section">
        <div class="steal-title">🪙 Steal Attempt!</div>
        <div class="steal-desc">
          <b style="color:${stealing.color}">${esc(stealing.name)}</b> is spending a chip — guess the <b>exact year</b> (within ±3) to steal the card!
        </div>
        <div class="steal-guess-row">
          <input class="steal-year-input" id="steal-year-inp" type="number" min="1950" max="2024" placeholder="Year…" onkeydown="if(event.key==='Enter')submitSteal()">
          <button class="steal-submit-btn" onclick="submitSteal()">STEAL IT</button>
          <button class="steal-cancel-btn" onclick="cancelSteal()">Cancel (lose chip)</button>
        </div>
      </div>`;
    setTimeout(()=>document.getElementById('steal-year-inp')?.focus(),50);
    return;
  }

  if(G.phase==='bonus'){
    const winner=G.players[G._bonusPlayer];
    ui.innerHTML=`
      <div class="bonus-section">
        <div class="bonus-title">⭐ BONUS: Name the Artist!</div>
        <div class="bonus-desc">Correct placement! Guess the artist to earn back a chip. (Skip to continue)</div>
        <div class="bonus-row">
          <input class="bonus-input" id="bonus-artist-inp" placeholder="Artist name…"
                 onkeydown="if(event.key==='Enter')submitBonus()">
          <button class="bonus-btn" onclick="submitBonus()">GUESS</button>
          <button class="steal-cancel-btn" onclick="dismissBonus()">Skip</button>
        </div>
      </div>`;
    setTimeout(()=>document.getElementById('bonus-artist-inp')?.focus(),50);
    return;
  }
}

function renderTimelineGaps(playerIdx){
  const p=G.players[playerIdx];
  const tl=p.timeline; // sorted by year

  if(tl.length===0){
    return `<div class="timeline-row">
      <div class="tl-gap">
        <button class="tl-gap-btn" onclick="makeGuess(0)">📍 Place here (first card — always correct!)</button>
      </div>
    </div>
    <div style="font-size:11px;color:var(--dimmer);text-align:center;padding:6px 0">Your timeline is empty — this card goes anywhere.</div>`;
  }

  let html='<div class="timeline-row">';
  // gap before first card
  html+=`<div class="tl-gap"><button class="tl-gap-btn" onclick="makeGuess(0)">← Before</button></div>`;

  tl.forEach((card,i)=>{
    html+=`<div class="tl-card" style="border-color:${p.color}44">
      <div class="tl-card-year" style="color:${p.color}">${card.y}</div>
      <div class="tl-card-title">${esc(card.t)}</div>
      <div class="tl-card-artist">${esc(card.a)}</div>
    </div>`;
    if(i<tl.length-1){
      html+=`<div class="tl-gap"><button class="tl-gap-btn" onclick="makeGuess(${i+1})">↕</button></div>`;
    }
  });

  // gap after last card
  html+=`<div class="tl-gap"><button class="tl-gap-btn" onclick="makeGuess(${tl.length})">After →</button></div>`;
  html+='</div>';
  return html;
}

function renderStealButtons(container, enabled){
  const others=G.players.map((p,i)=>({p,i})).filter(({i})=>i!==G.currentPlayer);
  if(!others.length) return;

  const div=document.createElement('div');
  div.className='steal-section';
  div.innerHTML=`
    <div class="steal-title">🪙 Steal</div>
    <div class="steal-desc">${enabled
      ? 'Other players: spend a chip to steal this card by guessing the exact year (±3).'
      : 'Listen to the song, then steal if the active player misses.'}</div>
    <div class="steal-players">
      ${others.map(({p,i})=>`
        <button class="steal-player-btn" onclick="initSteal(${i})" ${(!enabled||p.chips<=0)?'disabled':''}>
          <div class="pc-dot" style="background:${p.color}"></div>
          <span class="steal-btn-name" style="color:${p.color}">${esc(p.name)}</span>
          <span class="steal-btn-chips">${'🪙'.repeat(p.chips)}</span>
        </button>`).join('')}
    </div>`;
  container.appendChild(div);
}

// ═══════════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════════

function makeGuess(gapIdx){
  // gapIdx: 0=before first, 1=between 0&1, ..., n=after last
  const p=G.players[G.currentPlayer];
  const song=G.currentSong;
  const tl=p.timeline;
  let correct=false;

  if(tl.length===0){
    correct=true; // first card always placed correctly
  } else {
    const lo = gapIdx===0    ? -Infinity : tl[gapIdx-1].y;
    const hi = gapIdx>=tl.length ? Infinity : tl[gapIdx].y;
    correct = song.y > lo && song.y <= hi;
  }

  if(correct){
    // insert into timeline at gapIdx, keep sorted
    p.timeline.splice(gapIdx,0,{y:song.y,t:song.t,a:song.a});
    p.score=p.timeline.length;
    showResult('right', G.currentPlayer, song, null);
    G.phase='bonus';
    G._bonusPlayer=G.currentPlayer;
  } else {
    // wrong — offer steal
    showResult('wrong', G.currentPlayer, song, null);
    // steal phase is handled via result dismiss
    G._pendingSongAfterWrong=song;
    G._wrongGap=gapIdx;
  }
}

function showResult(type, playerIdx, song, detail){
  const p=G.players[playerIdx];
  const overlay=document.getElementById('result-overlay');

  if(type==='right'){
    document.getElementById('res-icon').textContent='✅';
    document.getElementById('res-title').textContent='CORRECT!';
    document.getElementById('res-title').className='result-title right';
    document.getElementById('res-song').innerHTML=`<b>${esc(song.t)}</b>`;
    document.getElementById('res-year').textContent=song.y;
    document.getElementById('res-detail').innerHTML=`<b style="color:${p.color}">${esc(p.name)}</b> placed it correctly — ${esc(song.a)} (${song.y})<br>Score: ${p.score}/${G.cardsToWin}`;
    document.getElementById('res-next-btn').textContent='Guess Artist? →';
    document.getElementById('res-next-btn').onclick=()=>{ overlay.style.display='none'; renderPhaseUI(); };
  } else if(type==='wrong'){
    document.getElementById('res-icon').textContent='❌';
    document.getElementById('res-title').textContent='WRONG!';
    document.getElementById('res-title').className='result-title wrong';
    document.getElementById('res-song').innerHTML=`<b>${esc(song.t)}</b>`;
    document.getElementById('res-year').textContent=song.y;
    document.getElementById('res-detail').innerHTML=`${esc(song.a)} (${song.y})<br>Card goes back to the deck. Others can steal!`;
    document.getElementById('res-next-btn').textContent='Open Steal →';
    document.getElementById('res-next-btn').onclick=()=>{
      overlay.style.display='none';
      G.phase='steal_phase_open';
      renderStealPhaseOpen();
    };
  } else if(type==='steal'){
    document.getElementById('res-icon').textContent='🪙';
    document.getElementById('res-title').textContent='STOLEN!';
    document.getElementById('res-title').className='result-title steal';
    document.getElementById('res-song').innerHTML=`<b>${esc(song.t)}</b>`;
    document.getElementById('res-year').textContent=song.y;
    document.getElementById('res-detail').innerHTML=`<b style="color:${p.color}">${esc(p.name)}</b> snagged it! ${esc(song.a)} (${song.y})<br>Score: ${p.score}/${G.cardsToWin}`;
    document.getElementById('res-next-btn').textContent='Next Turn →';
    document.getElementById('res-next-btn').onclick=()=>dismissResult();
  } else if(type==='steal_fail'){
    document.getElementById('res-icon').textContent='💸';
    document.getElementById('res-title').textContent='MISSED!';
    document.getElementById('res-title').className='result-title wrong';
    document.getElementById('res-song').innerHTML=`<b>${esc(song.t)}</b>`;
    document.getElementById('res-year').textContent=song.y;
    document.getElementById('res-detail').innerHTML=`${esc(song.a)} (${song.y})<br>Chip lost! ${detail||''}`;
    document.getElementById('res-next-btn').textContent='Next Turn →';
    document.getElementById('res-next-btn').onclick=()=>dismissResult();
  }

  overlay.style.display='flex';
}

function renderStealPhaseOpen(){
  const ui=document.getElementById('phase-ui');
  const others=G.players.map((p,i)=>({p,i})).filter(({i})=>i!==G.currentPlayer);
  ui.innerHTML=`
    <div class="steal-section">
      <div class="steal-title">🪙 Steal Window Open!</div>
      <div class="steal-desc">Anyone can spend a chip and guess the year (±3 years) to steal this card!</div>
      <div class="steal-players">
        ${others.map(({p,i})=>`
          <button class="steal-player-btn" onclick="initSteal(${i})" ${p.chips<=0?'disabled':''}>
            <div class="pc-dot" style="background:${p.color}"></div>
            <span class="steal-btn-name" style="color:${p.color}">${esc(p.name)}</span>
            <span class="steal-btn-chips">${'🪙'.repeat(p.chips)}</span>
          </button>`).join('')}
      </div>
      <div style="margin-top:12px">
        <button class="steal-cancel-btn" onclick="noSteal()">Nobody steals — Next Turn →</button>
      </div>
    </div>`;
}

function noSteal(){
  advanceTurn();
}

function initSteal(playerIdx){
  G.stealActive=playerIdx;
  G.phase='steal_phase';
  renderPhaseUI();
}

function submitSteal(){
  const inp=document.getElementById('steal-year-inp');
  const guess=parseInt(inp?.value)||0;
  const song=G.currentSong || G._pendingSongAfterWrong;
  const stealer=G.players[G.stealActive];

  stealer.chips=Math.max(0,stealer.chips-1); // spend chip

  const diff=Math.abs(guess-song.y);
  if(diff<=3){
    // steal success — chip refunded
    stealer.chips=Math.min(G.startChips,stealer.chips+1);
    stealer.timeline.push({y:song.y,t:song.t,a:song.a});
    stealer.timeline.sort((a,b)=>a.y-b.y);
    stealer.score=stealer.timeline.length;
    showResult('steal', G.stealActive, song, null);
    G._stealSuccess=true;
  } else {
    showResult('steal_fail', G.stealActive, song, `Correct year: ${song.y}. You guessed ${guess}.`);
    G._stealSuccess=false;
  }
}

function cancelSteal(){
  // Spent chip, no guess
  const stealer=G.players[G.stealActive];
  stealer.chips=Math.max(0,stealer.chips-1);
  G.stealActive=null;
  G.phase='steal_phase_open';
  renderStealPhaseOpen();
  renderPlayersStrip();
}

function submitBonus(){
  const inp=document.getElementById('bonus-artist-inp');
  const guess=(inp?.value||'').trim().toLowerCase();
  const song=G.currentSong;
  const p=G.players[G._bonusPlayer];
  const correct=song.a.toLowerCase().split(' ').some(w=>w.length>3&&guess.includes(w));
  if(correct){
    p.chips=Math.min(G.startChips+3,p.chips+1); // allow going above start as bonus
    alert(`✅ Correct! ${song.a} — you earned a chip! 🪙 (${p.chips} chips)`);
  } else {
    alert(`❌ Nope — it was ${song.a}.`);
  }
  dismissBonus();
}

function dismissBonus(){
  checkWin(G._bonusPlayer);
}

function dismissResult(){
  document.getElementById('result-overlay').style.display='none';
  renderPlayersStrip();
  renderAllTimelines();
  advanceTurn();
}

function advanceTurn(){
  document.getElementById('result-overlay').style.display='none';
  G.stealActive=null;
  G._pendingSongAfterWrong=null;
  G._stealSuccess=false;
  G.currentPlayer=(G.currentPlayer+1)%G.players.length;
  if(G.currentPlayer===0) G.round++;
  nextTurn();
}

function checkWin(playerIdx){
  const p=G.players[playerIdx];
  renderPlayersStrip();
  renderAllTimelines();
  if(p.score>=G.cardsToWin){
    showWin(playerIdx);
  } else {
    advanceTurn();
  }
}

function showWin(winnerIdx){
  const winner=G.players[winnerIdx];
  document.getElementById('win-winner-name').innerHTML=`🎉 <span style="color:${winner.color}">${esc(winner.name)}</span> wins!`;

  const cards=document.getElementById('win-cards');
  cards.innerHTML=winner.timeline.map(c=>`
    <div class="win-card" style="border-color:${winner.color}">
      <div class="win-card-year" style="color:${winner.color}">${c.y}</div>
      <div class="win-card-info">${esc(c.t)}<br>${esc(c.a)}</div>
    </div>`).join('');

  const sb=document.getElementById('win-scoreboard');
  const sorted=[...G.players].sort((a,b)=>b.score-a.score);
  sb.innerHTML='<h3>Final Scores</h3>'+sorted.map(p=>`
    <div class="win-score-row">
      <div class="win-score-dot" style="background:${p.color}"></div>
      <div class="win-score-name">${esc(p.name)}</div>
      <div class="win-score-val" style="color:${p.color}">${p.score}</div>
    </div>`).join('');

  showScreen('win');
}

function goSetup(){
  stopYtIframe();
  showScreen('setup');
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
