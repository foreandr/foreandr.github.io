<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Splitter — Forge</title>
  <link rel="icon" type="image/x-icon" href="../../images.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
  // Set pdf.js worker before loading
  window.pdfjsWorkerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg:#0a0a0b; --bg2:#111113; --bg3:#18181b; --border:#252528;
  --text:#e2e2e6; --muted:#6b6b72; --accent:#c8a96e; --green:#5aab7a; --red:#e05555;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Crimson Pro',Georgia,serif;font-size:17px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}

main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:40px 40px 80px;}

/* Drop Zone */
.drop-zone{
  border:2px dashed var(--border);border-radius:12px;padding:52px 40px;
  text-align:center;cursor:pointer;transition:all .2s;background:var(--bg2);
  position:relative;
}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:rgba(200,169,110,.06);}
.drop-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.drop-icon{font-size:2.6rem;margin-bottom:12px;opacity:.5;}
.drop-zone h2{font-family:'Cinzel',serif;font-size:1.15rem;font-weight:600;color:var(--text);margin-bottom:6px;}
.drop-zone p{color:var(--muted);font-size:.9rem;font-style:italic;}

/* Controls */
.controls-bar{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  margin-top:28px;padding:14px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;
}
.controls-left{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.controls-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.badge-sel{
  font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.05em;
  background:rgba(200,169,110,.13);color:var(--accent);border:1px solid rgba(200,169,110,.25);
  padding:3px 12px;border-radius:20px;
}
.range-label{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);}
.range-input{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:6px 12px;font-family:'JetBrains Mono',monospace;font-size:.8rem;
  outline:none;width:180px;
}
.range-input:focus{border-color:var(--accent);}
.range-input::placeholder{color:var(--muted);}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;
  padding:8px 18px;border-radius:8px;border:none;cursor:pointer;transition:all .18s;font-weight:500;
}
.btn-primary{background:linear-gradient(135deg,var(--accent),#b8944e);color:#0a0a0b;}
.btn-primary:hover{filter:brightness(1.12);transform:translateY(-1px);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);border-color:var(--muted);}

/* File info bar */
.file-info-bar{
  display:flex;align-items:center;gap:14px;margin-top:16px;padding:10px 18px;
  background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted);
}
.file-name-show{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:400px;}
.change-btn{
  background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;
  padding:3px 10px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:.72rem;
  transition:all .15s;letter-spacing:.05em;
}
.change-btn:hover{color:var(--text);border-color:var(--muted);}

/* Thumbnail Grid */
.thumb-section{margin-top:24px;}
.thumb-section-header{
  display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap;
}
.thumb-section-header h3{font-family:'Cinzel',serif;font-size:1rem;font-weight:600;color:var(--text);}

.thumb-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;
}
.thumb-card{
  position:relative;border-radius:8px;border:2px solid var(--border);
  background:var(--bg3);cursor:pointer;transition:all .18s;overflow:hidden;
}
.thumb-card:hover{border-color:#3a3a3e;transform:translateY(-2px);}
.thumb-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.thumb-card canvas{width:100%;height:auto;display:block;}
.thumb-card .thumb-overlay{
  position:absolute;inset:0;background:rgba(200,169,110,.15);
  opacity:0;transition:opacity .15s;
}
.thumb-card.selected .thumb-overlay{opacity:1;}
.thumb-card .check-mark{
  position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);color:#0a0a0b;font-size:.7rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.5);transition:all .18s;
}
.thumb-card.selected .check-mark{opacity:1;transform:scale(1);}
.thumb-label{
  padding:5px 6px;text-align:center;font-family:'JetBrains Mono',monospace;
  font-size:.7rem;color:var(--muted);border-top:1px solid var(--border);
}
.thumb-card.selected .thumb-label{color:var(--accent);}

/* Loading overlay */
.loading-overlay{
  display:none;text-align:center;padding:60px 20px;color:var(--muted);
  font-family:'JetBrains Mono',monospace;font-size:.85rem;letter-spacing:.08em;
}
.loading-overlay.visible{display:block;}
.spinner{
  width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Progress */
.progress-wrap{margin-top:20px;display:none;}
.progress-wrap.visible{display:block;}
.progress-label{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--muted);margin-bottom:7px;letter-spacing:.05em;}
.progress-bar-track{height:6px;background:var(--bg3);border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.progress-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#e0c88a);border-radius:10px;transition:width .2s;}

/* Toast */
.toast-container{position:fixed;bottom:28px;right:28px;z-index:999;display:flex;flex-direction:column;gap:8px;}
.toast{
  font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.04em;
  padding:10px 18px;border-radius:8px;border:1px solid;
  animation:slideIn .2s ease;
}
.toast.success{background:rgba(90,171,122,.12);color:var(--green);border-color:rgba(90,171,122,.3);}
.toast.error{background:rgba(224,85,85,.1);color:var(--red);border-color:rgba(224,85,85,.25);}
.toast.info{background:rgba(200,169,110,.1);color:var(--accent);border-color:rgba(200,169,110,.25);}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>

<header style="position:relative;z-index:10;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#0f0f11,var(--bg2));padding:24px 40px 18px;flex-shrink:0">
  <div style="max-width:1100px;margin:0 auto">
    <a href="../../index.html" style="display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;margin-bottom:14px">← Back Home</a>
    <span style="display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:6px">Office</span>
    <h1 style="font-family:'Cinzel',serif;font-size:clamp(1.6rem,3vw,2.4rem);font-weight:700;background:linear-gradient(135deg,#e8e8ee,var(--accent),#e0c88a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">PDF Splitter</h1>
    <p style="font-size:.9rem;color:var(--muted);margin-top:6px;font-style:italic">Select pages visually and extract them to a new PDF — all in-browser.</p>
  </div>
</header>

<main>
  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".pdf,application/pdf">
    <div class="drop-icon">📑</div>
    <h2>Drop a PDF file here</h2>
    <p>or click to browse — pages will appear as thumbnails below</p>
  </div>

  <div id="fileInfoBar" class="file-info-bar" style="display:none">
    <span>📄</span>
    <span class="file-name-show" id="fileNameShow"></span>
    <span id="filePageCount" style="color:var(--accent);font-weight:700"></span>
    <button class="change-btn" id="changeFileBtn">Change File</button>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div>Rendering pages…</div>
  </div>

  <div id="thumbSection" class="thumb-section" style="display:none">
    <div class="thumb-section-header">
      <h3>Pages</h3>
      <span class="badge-sel" id="selBadge">0 selected</span>
    </div>

    <div class="controls-bar" style="margin-top:0">
      <div class="controls-left">
        <button class="btn btn-ghost" id="selectAllBtn">Select All</button>
        <button class="btn btn-ghost" id="deselectAllBtn">Deselect All</button>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="range-label">Range:</span>
          <input class="range-input" id="rangeInput" placeholder="e.g. 1-3, 5, 7-9" title="Enter page ranges">
          <button class="btn btn-ghost" id="applyRangeBtn" style="padding:7px 14px">Apply</button>
        </div>
      </div>
      <div class="controls-right">
        <button class="btn btn-primary" id="extractBtn" disabled>Extract Selected</button>
      </div>
    </div>

    <div class="thumb-grid" id="thumbGrid"></div>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label" id="progressLabel">Extracting…</div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressFill"></div>
    </div>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script>
const { PDFDocument } = PDFLib;

// Configure pdf.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let currentFile = null;
let totalPages = 0;
let selectedPages = new Set(); // 0-indexed
let pdfJsDoc = null;

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileInfoBar = document.getElementById('fileInfoBar');
const fileNameShow = document.getElementById('fileNameShow');
const filePageCount = document.getElementById('filePageCount');
const changeFileBtn = document.getElementById('changeFileBtn');
const loadingOverlay = document.getElementById('loadingOverlay');
const thumbSection = document.getElementById('thumbSection');
const thumbGrid = document.getElementById('thumbGrid');
const selBadge = document.getElementById('selBadge');
const selectAllBtn = document.getElementById('selectAllBtn');
const deselectAllBtn = document.getElementById('deselectAllBtn');
const rangeInput = document.getElementById('rangeInput');
const applyRangeBtn = document.getElementById('applyRangeBtn');
const extractBtn = document.getElementById('extractBtn');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (!f || !(f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'))) {
    toast('Please drop a PDF file.', 'error'); return;
  }
  loadFile(f);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); fileInput.value = ''; });
changeFileBtn.addEventListener('click', () => { fileInput.click(); });

async function loadFile(file) {
  currentFile = file;
  selectedPages.clear();
  thumbGrid.innerHTML = '';
  thumbSection.style.display = 'none';
  loadingOverlay.classList.add('visible');
  progressWrap.classList.remove('visible');

  fileNameShow.textContent = file.name;
  fileInfoBar.style.display = 'flex';

  try {
    const arrayBuffer = await file.arrayBuffer();
    pdfJsDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    totalPages = pdfJsDoc.numPages;
    filePageCount.textContent = `${totalPages} page${totalPages !== 1 ? 's' : ''}`;

    await renderAllThumbs();
  } catch (err) {
    console.error(err);
    toast('Failed to load PDF: ' + err.message, 'error');
    loadingOverlay.classList.remove('visible');
  }
}

async function renderAllThumbs() {
  thumbGrid.innerHTML = '';
  loadingOverlay.classList.add('visible');

  for (let i = 1; i <= totalPages; i++) {
    const page = await pdfJsDoc.getPage(i);
    const viewport = page.getViewport({ scale: 0.4 });

    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');

    await page.render({ canvasContext: ctx, viewport }).promise;

    const card = document.createElement('div');
    card.className = 'thumb-card';
    card.dataset.page = i - 1; // 0-indexed
    card.innerHTML = `
      <div class="thumb-overlay"></div>
      <div class="check-mark">✓</div>
      <div class="thumb-label">Page ${i}</div>
    `;
    card.insertBefore(canvas, card.firstChild);
    card.addEventListener('click', () => togglePage(i - 1));
    thumbGrid.appendChild(card);
  }

  loadingOverlay.classList.remove('visible');
  thumbSection.style.display = 'block';
  updateSelBadge();
}

function togglePage(idx) {
  if (selectedPages.has(idx)) {
    selectedPages.delete(idx);
  } else {
    selectedPages.add(idx);
  }
  updateCardState(idx);
  updateSelBadge();
}

function updateCardState(idx) {
  const card = thumbGrid.querySelector(`[data-page="${idx}"]`);
  if (!card) return;
  if (selectedPages.has(idx)) {
    card.classList.add('selected');
  } else {
    card.classList.remove('selected');
  }
}

function updateSelBadge() {
  const n = selectedPages.size;
  selBadge.textContent = `${n} of ${totalPages} selected`;
  extractBtn.disabled = n === 0;
}

selectAllBtn.addEventListener('click', () => {
  for (let i = 0; i < totalPages; i++) selectedPages.add(i);
  thumbGrid.querySelectorAll('.thumb-card').forEach(c => c.classList.add('selected'));
  updateSelBadge();
});

deselectAllBtn.addEventListener('click', () => {
  selectedPages.clear();
  thumbGrid.querySelectorAll('.thumb-card').forEach(c => c.classList.remove('selected'));
  updateSelBadge();
});

applyRangeBtn.addEventListener('click', applyRange);
rangeInput.addEventListener('keydown', e => { if (e.key === 'Enter') applyRange(); });

function applyRange() {
  const raw = rangeInput.value.trim();
  if (!raw) return;
  const newSel = parseRangeString(raw, totalPages);
  if (newSel === null) { toast('Invalid range format. Use e.g. "1-3, 5, 7-9"', 'error'); return; }
  selectedPages.clear();
  newSel.forEach(i => selectedPages.add(i));
  thumbGrid.querySelectorAll('.thumb-card').forEach(c => {
    const idx = parseInt(c.dataset.page);
    selectedPages.has(idx) ? c.classList.add('selected') : c.classList.remove('selected');
  });
  updateSelBadge();
  toast(`Selected ${selectedPages.size} page${selectedPages.size !== 1 ? 's' : ''} from range.`, 'info');
}

function parseRangeString(str, max) {
  const result = new Set();
  const parts = str.split(',');
  for (const part of parts) {
    const p = part.trim();
    if (!p) continue;
    if (/^\d+$/.test(p)) {
      const n = parseInt(p);
      if (n < 1 || n > max) return null;
      result.add(n - 1);
    } else if (/^\d+-\d+$/.test(p)) {
      const [a, b] = p.split('-').map(Number);
      if (a < 1 || b > max || a > b) return null;
      for (let i = a; i <= b; i++) result.add(i - 1);
    } else {
      return null;
    }
  }
  return result;
}

extractBtn.addEventListener('click', async () => {
  if (selectedPages.size === 0 || !currentFile) return;
  extractBtn.disabled = true;
  progressWrap.classList.add('visible');
  setProgress(0, 'Loading source PDF…');

  try {
    const buf = await currentFile.arrayBuffer();
    setProgress(20, 'Reading pages…');
    const srcDoc = await PDFDocument.load(buf, { ignoreEncryption: true });

    setProgress(40, 'Creating new document…');
    const newDoc = await PDFDocument.create();

    const sortedPages = Array.from(selectedPages).sort((a, b) => a - b);
    const copied = await newDoc.copyPages(srcDoc, sortedPages);
    copied.forEach(p => newDoc.addPage(p));

    setProgress(80, 'Saving PDF…');
    const pdfBytes = await newDoc.save();
    setProgress(100, 'Done!');

    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'extracted.pdf';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);

    toast(`Extracted ${sortedPages.length} page${sortedPages.length !== 1 ? 's' : ''} successfully.`, 'success');
  } catch (err) {
    console.error(err);
    toast('Extraction failed: ' + err.message, 'error');
  }

  setTimeout(() => progressWrap.classList.remove('visible'), 2000);
  extractBtn.disabled = selectedPages.size === 0;
});

function setProgress(pct, label) {
  progressFill.style.width = pct + '%';
  progressLabel.textContent = label;
}

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 350); }, 3500);
}
</script>
</body>
</html>
