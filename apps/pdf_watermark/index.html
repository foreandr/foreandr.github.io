<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Watermark</title>
  <link rel="icon" type="image/x-icon" href="../../images.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    :root {
      --bg: #0b1119;
      --panel: #121a27;
      --panel-2: #182236;
      --border: #273857;
      --text: #e7edf7;
      --muted: #9fb2c7;
      --accent: #ef4444;
      --shadow: 0 14px 30px rgba(0,0,0,0.4);
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% -20%, rgba(239, 68, 68, 0.2), transparent 60%),
        radial-gradient(900px 500px at 90% -20%, rgba(59, 130, 246, 0.18), transparent 60%),
        var(--bg);
      min-height: 100vh;
    }
    header {
      padding: 26px 36px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(18, 26, 39, 0.95), rgba(11, 17, 25, 0.9));
      position: sticky; top: 0; z-index: 10;
    }
    header .wrap { max-width: 1100px; margin: 0 auto; }
    .back {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--muted); text-decoration: none; font-size: 12px;
      letter-spacing: 0.2em; text-transform: uppercase;
      border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px;
      font-family: var(--mono);
    }
    h1 { margin-top: 12px; font-size: clamp(1.7rem, 2.8vw, 2.5rem); }
    .sub { margin-top: 6px; color: var(--muted); }
    main { max-width: 1100px; margin: 0 auto; padding: 30px 36px 80px; display: grid; gap: 22px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: var(--shadow);
    }
    input, select {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 0.85rem;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .btn {
      background: var(--accent);
      color: #1a0707;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
    }
    .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .status { font-family: var(--mono); font-size: 0.8rem; color: var(--muted); min-height: 18px; }
    @media (max-width: 640px) {
      header, main { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="back" href="../../index.html">Back Home</a>
      <h1>PDF Watermark</h1>
      <p class="sub">Stamp a text watermark across every page of a PDF.</p>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="row">
        <input type="file" id="fileInput" accept="application/pdf">
      </div>
      <div class="grid">
        <input id="wmText" value="CONFIDENTIAL">
        <input id="wmSize" value="48">
        <input id="wmOpacity" value="0.2">
        <input id="wmRotate" value="-45">
      </div>
      <div class="row">
        <button class="btn" id="applyBtn">Apply Watermark</button>
        <button class="btn secondary" id="clearBtn">Clear</button>
      </div>
      <div class="status" id="status"></div>
    </section>
  </main>

  <script>
    const { PDFDocument, rgb, degrees } = PDFLib;
    const fileInput = document.getElementById('fileInput');
    const wmText = document.getElementById('wmText');
    const wmSize = document.getElementById('wmSize');
    const wmOpacity = document.getElementById('wmOpacity');
    const wmRotate = document.getElementById('wmRotate');
    const statusEl = document.getElementById('status');

    document.getElementById('applyBtn').addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      statusEl.textContent = 'Processing…';
      const buf = await file.arrayBuffer();
      const pdf = await PDFDocument.load(buf);
      const pages = pdf.getPages();
      const text = wmText.value || 'WATERMARK';
      const size = parseFloat(wmSize.value || '48');
      const opacity = Math.min(1, Math.max(0, parseFloat(wmOpacity.value || '0.2')));
      const rotate = degrees(parseFloat(wmRotate.value || '-45'));

      pages.forEach(p => {
        const { width, height } = p.getSize();
        p.drawText(text, {
          x: width * 0.1,
          y: height * 0.5,
          size,
          rotate,
          color: rgb(1, 0, 0),
          opacity
        });
      });

      const bytes = await pdf.save();
      const blob = new Blob([bytes], { type: 'application/pdf' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'watermarked.pdf';
      a.click();
      statusEl.textContent = 'Done.';
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      fileInput.value = '';
      statusEl.textContent = '';
    });
  </script>
</body>
</html>
