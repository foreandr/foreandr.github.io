<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>What Is My IP</title>
<link rel="icon" type="image/x-icon" href="../../images.ico">
<style>
:root {
  --bg: #07090f; --panel: #0e1118; --panel2: #141820;
  --border: #1e2333; --text: #e8eaf6; --muted: #4a5080;
  --accent: #60a5fa; --accent2: #3b82f6; --green: #34d399;
  --mono: "JetBrains Mono", "Fira Code", ui-monospace, monospace;
  --sans: "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); display: flex; flex-direction: column; min-height: 100vh; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 48px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.back { color: var(--muted); text-decoration: none; font-size: 13px; } .back:hover { color: var(--accent); }
.app-title { font-size: 14px; font-weight: 700; color: var(--accent); }

.main { flex: 1; overflow-y: auto; padding: 28px 18px 60px; display: flex; flex-direction: column; gap: 20px; max-width: 640px; margin: 0 auto; width: 100%; }

/* Big IP display */
.ip-hero { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 10px; }
.ip-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.8px; color: var(--muted); }
.ip-address { font-family: var(--mono); font-size: clamp(1.6rem, 6vw, 2.6rem); font-weight: 700; color: var(--text); letter-spacing: -0.02em; word-break: break-all; }
.ip-address.loading { color: var(--muted); animation: pulse 1.4s ease infinite; }
@keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
.ip-type-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.chip { border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; font-family: var(--mono); }
.chip.green { background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.3); color: var(--green); }
.chip.blue { background: rgba(96,165,250,.12); border: 1px solid rgba(96,165,250,.3); color: var(--accent); }
.chip.muted { background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }

/* Copy button */
.copy-btn { align-self: flex-start; background: var(--accent2); color: #fff; border: none; border-radius: 10px; padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 7px; }
.copy-btn:hover { background: var(--accent); color: #000; }
.copy-btn.copied { background: var(--green); color: #000; }

/* Location section */
.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.8px; color: var(--muted); padding-left: 2px; }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.stat-key { font-size: 10px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--muted); margin-bottom: 5px; }
.stat-val { font-size: 14px; font-weight: 600; color: var(--text); word-break: break-word; }
.stat-val.mono { font-family: var(--mono); font-size: 13px; }
.stat-val.skeleton { background: var(--panel2); border-radius: 4px; color: transparent; min-height: 20px; animation: pulse 1.4s ease infinite; }

/* Map placeholder */
.map-wrap { border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: var(--panel); height: 220px; display: flex; align-items: center; justify-content: center; }
.map-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
.map-placeholder { color: var(--muted); font-size: 13px; text-align: center; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.map-placeholder span { font-size: 32px; }

/* Error */
.error-box { background: #1a0808; border: 1px solid #dc2626; border-radius: 12px; padding: 16px; font-size: 13px; color: #fca5a5; line-height: 1.6; }
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="../../index.html">← Back</a>
  <span class="app-title">🌐 What Is My IP</span>
</div>

<div class="main">

  <!-- Hero -->
  <div class="ip-hero">
    <div class="ip-label">Your IP Address</div>
    <div class="ip-address loading" id="ipAddr">Detecting…</div>
    <div class="ip-type-row" id="ipChips"></div>
    <button class="copy-btn" id="copyBtn" onclick="copyIP()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Copy IP
    </button>
  </div>

  <!-- Location -->
  <div class="section-title">Location &amp; Network</div>
  <div class="stats-grid" id="statsGrid">
    <div class="stat"><div class="stat-key">City</div><div class="stat-val skeleton" id="sCity">████████</div></div>
    <div class="stat"><div class="stat-key">Region</div><div class="stat-val skeleton" id="sRegion">████████</div></div>
    <div class="stat"><div class="stat-key">Country</div><div class="stat-val skeleton" id="sCountry">████████</div></div>
    <div class="stat"><div class="stat-key">Postal</div><div class="stat-val skeleton mono" id="sPostal">████</div></div>
    <div class="stat"><div class="stat-key">ISP / Org</div><div class="stat-val skeleton" id="sOrg">████████████</div></div>
    <div class="stat"><div class="stat-key">Timezone</div><div class="stat-val skeleton mono" id="sTz">████████████</div></div>
    <div class="stat"><div class="stat-key">Latitude</div><div class="stat-val skeleton mono" id="sLat">████████</div></div>
    <div class="stat"><div class="stat-key">Longitude</div><div class="stat-val skeleton mono" id="sLon">████████</div></div>
  </div>

  <!-- Map -->
  <div class="section-title">Map</div>
  <div class="map-wrap" id="mapWrap">
    <div class="map-placeholder"><span>🗺️</span>Loading map…</div>
  </div>

  <div id="errorBox" style="display:none"></div>
</div>

<script>
let myIP = '';

async function loadIP() {
  try {
    // Primary: ipapi.co
    const res = await fetch('https://ipapi.co/json/');
    if (!res.ok) throw new Error('ipapi failed');
    const d = await res.json();
    if (d.error) throw new Error(d.reason || 'lookup failed');
    render(d);
  } catch (e) {
    // Fallback: ip-api.com
    try {
      const res2 = await fetch('https://ip-api.com/json/?fields=status,message,country,regionName,city,zip,lat,lon,timezone,isp,org,query,mobile,proxy,hosting');
      const d2 = await res2.json();
      if (d2.status !== 'success') throw new Error(d2.message);
      render({
        ip: d2.query, city: d2.city, region: d2.regionName,
        country_name: d2.country, postal: d2.zip, org: d2.org || d2.isp,
        timezone: d2.timezone, latitude: d2.lat, longitude: d2.lon,
        version: d2.query?.includes(':') ? 'IPv6' : 'IPv4',
        mobile: d2.mobile, proxy: d2.proxy, hosting: d2.hosting
      });
    } catch (e2) {
      showError(`Could not fetch IP info: ${e2.message}`);
    }
  }
}

function render(d) {
  myIP = d.ip || '';

  // IP display
  const ipEl = document.getElementById('ipAddr');
  ipEl.textContent = myIP;
  ipEl.classList.remove('loading');

  // Chips
  const chips = document.getElementById('ipChips');
  const version = d.version || (myIP.includes(':') ? 'IPv6' : 'IPv4');
  chips.innerHTML = `<span class="chip blue">${version}</span>`;
  if (d.mobile) chips.innerHTML += `<span class="chip green">Mobile</span>`;
  if (d.proxy)  chips.innerHTML += `<span class="chip muted">Proxy / VPN</span>`;
  if (d.hosting) chips.innerHTML += `<span class="chip muted">Hosting / DC</span>`;

  // Stats
  const set = (id, val, cls='') => {
    const el = document.getElementById(id);
    el.textContent = val || '—';
    el.className = 'stat-val' + (cls ? ' '+cls : '');
  };
  set('sCity',    d.city);
  set('sRegion',  d.region || d.region_code);
  set('sCountry', d.country_name || d.country);
  set('sPostal',  d.postal,    'mono');
  set('sOrg',     d.org);
  set('sTz',      d.timezone,  'mono');
  set('sLat',     d.latitude  ? d.latitude.toFixed(4)  : (d.lat  ? Number(d.lat).toFixed(4)  : ''), 'mono');
  set('sLon',     d.longitude ? d.longitude.toFixed(4) : (d.lon ? Number(d.lon).toFixed(4) : ''), 'mono');

  // Map
  const lat = d.latitude || d.lat;
  const lon = d.longitude || d.lon;
  if (lat && lon) {
    const mapWrap = document.getElementById('mapWrap');
    // OpenStreetMap embed — no API key needed
    mapWrap.innerHTML = `<iframe
      src="https://www.openstreetmap.org/export/embed.html?bbox=${lon-0.15},${lat-0.1},${Number(lon)+0.15},${Number(lat)+0.1}&layer=mapnik&marker=${lat},${lon}"
      allowfullscreen loading="lazy"></iframe>`;
  }
}

function copyIP() {
  if (!myIP) return;
  navigator.clipboard.writeText(myIP).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy IP`;
      btn.classList.remove('copied');
    }, 2000);
  });
}

function showError(msg) {
  document.getElementById('ipAddr').textContent = 'Error';
  document.getElementById('ipAddr').classList.remove('loading');
  const eb = document.getElementById('errorBox');
  eb.style.display = 'block';
  eb.className = 'error-box';
  eb.textContent = msg;
}

loadIP();
</script>
</body>
</html>
