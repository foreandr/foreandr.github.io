<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Agenda Timer</title>
  <link rel="icon" type="image/x-icon" href="../../images.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1119;
      --panel: #121a27;
      --panel-2: #182236;
      --border: #273857;
      --text: #e7edf7;
      --muted: #9fb2c7;
      --accent: #f59e0b;
      --shadow: 0 14px 30px rgba(0,0,0,0.4);
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(900px 500px at 10% -20%, rgba(245, 158, 11, 0.2), transparent 60%),
        radial-gradient(900px 500px at 90% -20%, rgba(59, 130, 246, 0.18), transparent 60%),
        var(--bg);
      min-height: 100vh;
    }
    header {
      padding: 26px 36px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(18, 26, 39, 0.95), rgba(11, 17, 25, 0.9));
      position: sticky; top: 0; z-index: 10;
    }
    header .wrap { max-width: 1100px; margin: 0 auto; }
    .back {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--muted); text-decoration: none; font-size: 12px;
      letter-spacing: 0.2em; text-transform: uppercase;
      border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px;
      font-family: var(--mono);
    }
    h1 { margin-top: 12px; font-size: clamp(1.7rem, 2.8vw, 2.5rem); }
    .sub { margin-top: 6px; color: var(--muted); }
    main { max-width: 1100px; margin: 0 auto; padding: 30px 36px 80px; display: grid; gap: 22px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: var(--shadow);
    }
    input, textarea {
      width: 100%;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 0.85rem;
    }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
    .btn {
      background: var(--accent);
      color: #1d1403;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
    }
    .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .agenda { display: grid; gap: 8px; margin-top: 10px; }
    .item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1fr 90px 80px;
      gap: 8px;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.82rem;
    }
    .timer {
      font-family: var(--mono);
      font-size: 2rem;
      letter-spacing: 0.1em;
    }
    .muted { color: var(--muted); font-size: 0.8rem; }
    @media (max-width: 720px) {
      .item { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      header, main { padding-left: 20px; padding-right: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="back" href="../../index.html">Back Home</a>
      <h1>Meeting Agenda Timer</h1>
      <p class="sub">Plan the agenda, run a countdown per item, and export notes.</p>
    </div>
  </header>

  <main>
    <section class="panel">
      <input id="itemTitle" placeholder="Agenda item title">
      <div class="row">
        <input id="itemMinutes" placeholder="Minutes" value="5">
        <button class="btn" id="addBtn">Add Item</button>
        <button class="btn secondary" id="clearBtn">Clear Agenda</button>
      </div>
      <div class="agenda" id="agenda"></div>
    </section>

    <section class="panel">
      <div class="timer" id="timer">00:00</div>
      <div class="muted" id="currentItem">No active item</div>
      <div class="row">
        <button class="btn" id="startBtn">Start</button>
        <button class="btn secondary" id="pauseBtn" disabled>Pause</button>
        <button class="btn secondary" id="nextBtn" disabled>Next Item</button>
        <button class="btn secondary" id="resetBtn">Reset</button>
      </div>
      <textarea id="notes" placeholder="Meeting notes..."></textarea>
      <div class="row">
        <button class="btn secondary" id="exportBtn">Export Notes</button>
      </div>
    </section>
  </main>

  <script>
    const agendaEl = document.getElementById('agenda');
    const itemTitle = document.getElementById('itemTitle');
    const itemMinutes = document.getElementById('itemMinutes');
    const timerEl = document.getElementById('timer');
    const currentItemEl = document.getElementById('currentItem');
    const notesEl = document.getElementById('notes');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const nextBtn = document.getElementById('nextBtn');

    let agenda = [];
    let idx = 0;
    let remaining = 0;
    let interval = null;

    function renderAgenda() {
      agendaEl.innerHTML = '';
      agenda.forEach((it, i) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
          <div>${it.title}</div>
          <div>${it.minutes} min</div>
          <button class="btn secondary" data-remove="${i}">Remove</button>
        `;
        agendaEl.appendChild(div);
      });
      agendaEl.querySelectorAll('[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = parseInt(btn.dataset.remove, 10);
          agenda.splice(i, 1);
          renderAgenda();
        });
      });
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function loadItem(i) {
      if (!agenda.length) { currentItemEl.textContent = 'No active item'; timerEl.textContent = '00:00'; return; }
      idx = Math.min(i, agenda.length - 1);
      remaining = agenda[idx].minutes * 60;
      currentItemEl.textContent = agenda[idx].title;
      timerEl.textContent = formatTime(remaining);
      nextBtn.disabled = agenda.length < 2;
    }

    function tick() {
      if (remaining <= 0) {
        next();
        return;
      }
      remaining -= 1;
      timerEl.textContent = formatTime(remaining);
    }

    function start() {
      if (!agenda.length) return;
      if (!interval) interval = setInterval(tick, 1000);
      pauseBtn.disabled = false;
      startBtn.disabled = true;
    }

    function pause() {
      clearInterval(interval);
      interval = null;
      pauseBtn.disabled = true;
      startBtn.disabled = false;
    }

    function next() {
      pause();
      loadItem(idx + 1);
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      const title = itemTitle.value.trim();
      const mins = parseInt(itemMinutes.value, 10);
      if (!title || isNaN(mins)) return;
      agenda.push({ title, minutes: mins });
      itemTitle.value = '';
      renderAgenda();
      if (agenda.length === 1) loadItem(0);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      agenda = [];
      renderAgenda();
      loadItem(0);
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      pause();
      loadItem(0);
    });

    startBtn.addEventListener('click', start);
    pauseBtn.addEventListener('click', pause);
    nextBtn.addEventListener('click', next);

    document.getElementById('exportBtn').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(notesEl.value || '');
      a.download = 'meeting_notes.txt';
      a.click();
    });

    loadItem(0);
  </script>
</body>
</html>
