<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Images → PDF</title>
  <link rel="icon" type="image/x-icon" href="../../images.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0a0a0b;
      --bg2:    #111113;
      --bg3:    #18181b;
      --border: #252528;
      --text:   #e2e2e6;
      --muted:  #6b6b72;
      --accent: #c8a96e;
      --accent2: #6eb4d4;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 17px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      background-size: 200px; opacity: 0.6;
    }

    header {
      position: relative; z-index: 10;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #0f0f11 0%, var(--bg2) 100%);
      padding: 24px 40px 18px;
      flex-shrink: 0;
    }
    .header-inner { max-width: 1000px; margin: 0 auto; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--muted); text-decoration: none;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 12px; margin-bottom: 14px;
      transition: color 0.2s, border-color 0.2s;
    }
    .back-btn:hover { color: var(--accent); border-color: var(--accent); }
    .eyebrow {
      display: block;
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 6px;
    }
    h1 {
      font-family: 'Cinzel', serif; font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 700; letter-spacing: 0.04em;
      background: linear-gradient(135deg, #e8e8ee 0%, var(--accent) 55%, #e0c88a 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      line-height: 1.1;
    }
    .header-sub { font-size: 0.9rem; color: var(--muted); margin-top: 6px; font-style: italic; }

    main {
      position: relative; z-index: 1;
      flex: 1;
      max-width: 1000px; margin: 0 auto; width: 100%;
      padding: 32px 24px 60px;
      display: flex; flex-direction: column; gap: 24px;
    }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: var(--bg2);
    }
    .drop-zone:hover, .drop-zone.dragging {
      border-color: var(--accent);
      background: rgba(200,169,110,0.05);
    }
    .drop-icon { font-size: 2.5rem; margin-bottom: 12px; }
    .drop-title {
      font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text); margin-bottom: 6px;
    }
    .drop-sub { font-size: 0.88rem; color: var(--muted); }
    #file-input { display: none; }

    /* Controls bar */
    .controls-bar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 18px;
    }
    .ctrl-label {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin-right: 4px;
    }
    select {
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text);
      font-family: 'JetBrains Mono', monospace; font-size: 0.78rem;
      padding: 6px 10px; cursor: pointer; outline: none;
    }
    select:focus { border-color: var(--accent); }

    .spacer { flex: 1; }

    .count-badge {
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      color: var(--muted); padding: 4px 10px;
      background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
    }
    .count-badge span { color: var(--accent); font-weight: 700; }

    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      border: none; border-radius: 7px; padding: 9px 18px; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    .btn-clear { background: rgba(200,169,110,0.1); color: var(--accent); border: 1px solid rgba(200,169,110,0.25); }
    .btn-export { background: rgba(200,169,110,0.18); color: var(--accent); border: 1px solid rgba(200,169,110,0.35); }

    /* Image grid */
    .img-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }
    .img-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
      cursor: grab; position: relative;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      user-select: none;
    }
    .img-card:active { cursor: grabbing; }
    .img-card:hover { border-color: rgba(200,169,110,0.4); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .img-card.sortable-ghost { opacity: 0.35; }
    .img-card.sortable-chosen { transform: scale(1.03); border-color: var(--accent); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }

    .img-thumb {
      width: 100%; aspect-ratio: 4/3;
      object-fit: cover; display: block;
      background: var(--bg3);
    }
    .img-footer {
      padding: 8px 10px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .img-num {
      font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
      color: var(--accent); font-weight: 700;
    }
    .img-name {
      font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
      color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 80px;
    }
    .img-del {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 0.85rem; line-height: 1;
      padding: 2px 4px; border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }
    .img-del:hover { color: #e05555; background: rgba(224,85,85,0.12); }

    /* Progress */
    .progress-wrap {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px 20px;
      display: none;
    }
    .progress-wrap.visible { display: block; }
    .progress-label {
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px;
    }
    .progress-bar-track {
      background: var(--bg3); border-radius: 4px; height: 6px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--accent);
      border-radius: 4px; width: 0%;
      transition: width 0.2s;
    }
    .progress-text {
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
      color: var(--muted); margin-top: 8px;
    }

    @media (max-width: 600px) {
      header { padding: 16px 16px 14px; }
      main { padding: 20px 12px 40px; }
      .img-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a class="back-btn" href="../../index.html">← Back Home</a>
      <span class="eyebrow">Office</span>
      <h1>Images → PDF</h1>
      <p class="header-sub">Drag images in, reorder them, export as a single PDF — all in-browser, nothing uploaded.</p>
    </div>
  </header>

  <main>

    <div class="drop-zone" id="drop-zone">
      <input type="file" id="file-input" accept="image/*" multiple>
      <div class="drop-icon">🖼️</div>
      <div class="drop-title">Drop images here</div>
      <div class="drop-sub">or click to browse — JPEG, PNG, WebP, GIF supported</div>
    </div>

    <div class="controls-bar" id="controls-bar" style="display:none">
      <span class="ctrl-label">Page size</span>
      <select id="page-size">
        <option value="A4">A4</option>
        <option value="LETTER">US Letter</option>
        <option value="A3">A3</option>
        <option value="FIT">Fit to image</option>
      </select>

      <span class="ctrl-label" style="margin-left:8px">Orientation</span>
      <select id="orientation">
        <option value="portrait">Portrait</option>
        <option value="landscape">Landscape</option>
      </select>

      <span class="ctrl-label" style="margin-left:8px">Margin</span>
      <select id="margin">
        <option value="0">None</option>
        <option value="20" selected>Small</option>
        <option value="40">Medium</option>
        <option value="60">Large</option>
      </select>

      <div class="spacer"></div>
      <div class="count-badge"><span id="img-count">0</span> images</div>
      <button class="btn btn-clear" id="btn-clear">✕ Clear</button>
      <button class="btn btn-export" id="btn-export">↓ Export PDF</button>
    </div>

    <div class="img-grid" id="img-grid"></div>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-label">Building PDF…</div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text" id="progress-text">0 / 0</div>
    </div>

  </main>

  <script>
    const dropZone  = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const imgGrid   = document.getElementById('img-grid');
    const controls  = document.getElementById('controls-bar');
    const btnClear  = document.getElementById('btn-clear');
    const btnExport = document.getElementById('btn-export');
    const imgCount  = document.getElementById('img-count');
    const progressWrap = document.getElementById('progress-wrap');
    const progressFill = document.getElementById('progress-fill');
    const progressText = document.getElementById('progress-text');

    let images = []; // { id, name, dataUrl }
    let sortable;
    let idCounter = 0;

    /* ── Drop zone ── */
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', e => addFiles(e.target.files));

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragging'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragging'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragging');
      addFiles(e.dataTransfer.files);
    });

    function addFiles(files) {
      const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
      arr.forEach(f => {
        const reader = new FileReader();
        reader.onload = ev => {
          images.push({ id: idCounter++, name: f.name, dataUrl: ev.target.result });
          renderGrid();
        };
        reader.readAsDataURL(f);
      });
    }

    function renderGrid() {
      imgGrid.innerHTML = '';
      if (images.length === 0) {
        controls.style.display = 'none';
        return;
      }
      controls.style.display = 'flex';
      imgCount.textContent = images.length;

      images.forEach((img, idx) => {
        const card = document.createElement('div');
        card.className = 'img-card';
        card.dataset.id = img.id;
        card.innerHTML = `
          <img class="img-thumb" src="${img.dataUrl}" alt="${img.name}">
          <div class="img-footer">
            <span class="img-num">#${idx + 1}</span>
            <span class="img-name">${img.name}</span>
            <button class="img-del" title="Remove" data-id="${img.id}">✕</button>
          </div>`;
        imgGrid.appendChild(card);
      });

      // Bind delete buttons
      imgGrid.querySelectorAll('.img-del').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          const id = parseInt(btn.dataset.id);
          images = images.filter(img => img.id !== id);
          renderGrid();
        });
      });

      // Init / refresh Sortable
      if (sortable) sortable.destroy();
      sortable = Sortable.create(imgGrid, {
        animation: 150,
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        onEnd() {
          // Sync images array to new DOM order
          const newOrder = [];
          imgGrid.querySelectorAll('.img-card').forEach(card => {
            const id = parseInt(card.dataset.id);
            const img = images.find(i => i.id === id);
            if (img) newOrder.push(img);
          });
          images = newOrder;
          // Update index numbers only
          imgGrid.querySelectorAll('.img-num').forEach((el, i) => el.textContent = `#${i + 1}`);
        }
      });
    }

    btnClear.addEventListener('click', () => {
      images = [];
      renderGrid();
      progressWrap.classList.remove('visible');
    });

    /* ── Export ── */
    btnExport.addEventListener('click', async () => {
      if (images.length === 0) return;
      btnExport.disabled = true;
      progressWrap.classList.add('visible');

      const pageSize  = document.getElementById('page-size').value;
      const orientation = document.getElementById('orientation').value;
      const margin    = parseInt(document.getElementById('margin').value);

      // Standard page dims in points (72 pt/inch)
      const pageDims = {
        A4:     [595.28, 841.89],
        LETTER: [612,    792   ],
        A3:     [841.89, 1190.55],
        FIT:    null,
      };

      try {
        const { PDFDocument } = PDFLib;
        const pdfDoc = await PDFDocument.create();

        for (let i = 0; i < images.length; i++) {
          progressFill.style.width = `${Math.round((i / images.length) * 100)}%`;
          progressText.textContent = `${i + 1} / ${images.length}`;

          const dataUrl = images[i].dataUrl;
          const mimeMatch = dataUrl.match(/^data:(image\/[^;]+);/);
          const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';

          // Convert dataUrl → Uint8Array
          const base64 = dataUrl.split(',')[1];
          const binary = atob(base64);
          const bytes  = new Uint8Array(binary.length);
          for (let b = 0; b < binary.length; b++) bytes[b] = binary.charCodeAt(b);

          let embeddedImg;
          if (mime === 'image/png') {
            embeddedImg = await pdfDoc.embedPng(bytes);
          } else {
            // pdf-lib only supports JPEG natively for non-PNG; convert via canvas
            embeddedImg = await embedViaCanvas(pdfDoc, dataUrl);
          }

          const { width: iw, height: ih } = embeddedImg;

          let pw, ph;
          if (pageSize === 'FIT') {
            pw = iw + margin * 2;
            ph = ih + margin * 2;
          } else {
            [pw, ph] = pageDims[pageSize];
            if (orientation === 'landscape') [pw, ph] = [ph, pw];
          }

          const page = pdfDoc.addPage([pw, ph]);

          // Scale image to fit within margins
          const maxW = pw - margin * 2;
          const maxH = ph - margin * 2;
          const scale = Math.min(maxW / iw, maxH / ih, 1);
          const dw = iw * scale, dh = ih * scale;
          const x = margin + (maxW - dw) / 2;
          const y = margin + (maxH - dh) / 2;

          page.drawImage(embeddedImg, { x, y, width: dw, height: dh });

          // Let the browser breathe
          await new Promise(r => setTimeout(r, 0));
        }

        progressFill.style.width = '100%';
        progressText.textContent = 'Done!';

        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href = url; a.download = 'images.pdf';
        a.click();
        URL.revokeObjectURL(url);

        setTimeout(() => {
          progressWrap.classList.remove('visible');
          progressFill.style.width = '0%';
        }, 2000);

      } catch (err) {
        progressText.textContent = 'Error: ' + err.message;
        console.error(err);
      } finally {
        btnExport.disabled = false;
      }
    });

    async function embedViaCanvas(pdfDoc, dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          c.width = img.naturalWidth; c.height = img.naturalHeight;
          c.getContext('2d').drawImage(img, 0, 0);
          c.toBlob(async blob => {
            try {
              const buf = await blob.arrayBuffer();
              const u8  = new Uint8Array(buf);
              const embedded = await pdfDoc.embedJpg(u8);
              resolve(embedded);
            } catch(e) { reject(e); }
          }, 'image/jpeg', 0.92);
        };
        img.onerror = reject;
        img.src = dataUrl;
      });
    }
  </script>
</body>
</html>
