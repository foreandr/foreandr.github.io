<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to PDF</title>
<link rel="icon" type="image/x-icon" href="../../images.ico">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg: #f8f8f6;
  --surface: #ffffff;
  --border: #e0ddd8;
  --text: #1a1a18;
  --muted: #8a8880;
  --accent: #2563eb;
  --accent-dim: rgba(37,99,235,0.08);
  --danger: #dc2626;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --sans: "Segoe UI", system-ui, sans-serif;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Topbar ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 10;
}
.back { color: var(--muted); text-decoration: none; font-size: 13px; }
.back:hover { color: var(--accent); }
.app-title { font-size: 15px; font-weight: 700; letter-spacing: -.3px; }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px; border-radius: var(--radius);
  font-size: 13px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); transition: all .15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }

/* ── Main layout ── */
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 0;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
  gap: 24px;
  align-items: start;
}

/* ── Settings panel ── */
.settings-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: sticky;
  top: 76px;
}
.panel-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.setting-group { display: flex; flex-direction: column; gap: 8px; }
.setting-label { font-size: 12px; font-weight: 600; color: var(--muted); }
.setting-row { display: flex; gap: 8px; flex-wrap: wrap; }
.seg-btn {
  flex: 1;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg);
  font-size: 12px; font-weight: 500;
  cursor: pointer; color: var(--text);
  text-align: center; transition: all .12s;
  min-width: 50px;
}
.seg-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.seg-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
input[type="range"] {
  width: 100%; accent-color: var(--accent); cursor: pointer;
}
input[type="color"] {
  width: 38px; height: 30px; border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; padding: 2px;
}
select {
  width: 100%; padding: 7px 10px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--bg);
  font-size: 13px; color: var(--text); cursor: pointer;
}
.range-row { display: flex; align-items: center; gap: 10px; }
.range-val {
  min-width: 36px; text-align: right;
  font-size: 12px; font-family: var(--mono); color: var(--accent);
}
.color-row { display: flex; align-items: center; gap: 10px; }
.color-label { font-size: 12px; color: var(--muted); flex: 1; }

/* ── Editor area ── */
.editor-area {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.editor-toolbar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 8px 12px;
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  border-bottom: none;
}
.tb-btn {
  padding: 4px 10px; border-radius: 5px;
  border: 1px solid transparent; background: none;
  font-size: 12px; cursor: pointer; color: var(--text);
  transition: all .12s; font-family: var(--sans);
}
.tb-btn:hover { background: var(--accent-dim); border-color: var(--border); color: var(--accent); }
.tb-sep { width: 1px; background: var(--border); margin: 2px 4px; }
.title-input {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--border); border-bottom: none;
  border-radius: 0; font-size: 18px; font-weight: 700;
  background: var(--surface); color: var(--text);
  font-family: var(--sans); outline: none;
}
.title-input::placeholder { color: var(--muted); }
.text-editor {
  width: 100%;
  min-height: 500px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 0 0 var(--radius) var(--radius);
  resize: vertical;
  font-size: 14px;
  line-height: 1.7;
  font-family: var(--sans);
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color .15s;
}
.text-editor:focus { border-color: var(--accent); }

/* ── Preview pane ── */
.preview-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.preview-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  color: var(--muted); display: flex; align-items: center; gap: 10px;
}
#preview-frame {
  width: 100%; height: 700px; border: none;
  background: #e8e8e4;
}
.word-count {
  font-size: 12px; color: var(--muted); font-family: var(--mono);
  padding: 8px 16px; border-top: 1px solid var(--border);
  display: flex; gap: 20px;
}
.wc-item span { color: var(--text); font-weight: 600; }

/* ── Action row ── */
.action-row {
  display: flex; gap: 10px; align-items: center;
}
.action-row .btn { gap: 8px; }

/* ── Responsive ── */
@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; padding: 16px; }
  .settings-panel { position: static; }
}
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="../../index.html">← Back</a>
  <span class="app-title">Text → PDF</span>
  <div class="spacer"></div>
  <button class="btn" id="btn-preview">👁 Preview</button>
  <button class="btn primary" id="btn-download">⬇ Download PDF</button>
</div>

<div class="main">

  <!-- ── Settings Panel ── -->
  <div class="settings-panel">
    <div class="panel-title">Document Settings</div>

    <div class="setting-group">
      <div class="setting-label">Page Size</div>
      <div class="setting-row">
        <button class="seg-btn active" data-page="letter">Letter</button>
        <button class="seg-btn" data-page="a4">A4</button>
        <button class="seg-btn" data-page="legal">Legal</button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">Orientation</div>
      <div class="setting-row">
        <button class="seg-btn active" data-orient="portrait">Portrait</button>
        <button class="seg-btn" data-orient="landscape">Landscape</button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">Font Family</div>
      <select id="font-family">
        <option value="helvetica">Helvetica (Sans-serif)</option>
        <option value="times">Times New Roman (Serif)</option>
        <option value="courier">Courier (Monospace)</option>
      </select>
    </div>

    <div class="setting-group">
      <div class="setting-label">Body Font Size</div>
      <div class="range-row">
        <input type="range" id="font-size" min="8" max="24" value="12">
        <span class="range-val" id="font-size-val">12pt</span>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">Line Spacing</div>
      <div class="range-row">
        <input type="range" id="line-spacing" min="10" max="30" value="16" step="1">
        <span class="range-val" id="line-spacing-val">1.3×</span>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">Margins (mm)</div>
      <div class="range-row">
        <input type="range" id="margin" min="5" max="40" value="20">
        <span class="range-val" id="margin-val">20mm</span>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">Colors</div>
      <div class="color-row">
        <span class="color-label">Text</span>
        <input type="color" id="text-color" value="#1a1a18">
      </div>
      <div class="color-row">
        <span class="color-label">Background</span>
        <input type="color" id="bg-color" value="#ffffff">
      </div>
      <div class="color-row">
        <span class="color-label">Title</span>
        <input type="color" id="title-color" value="#1a1a18">
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">Header / Footer</div>
      <input type="text" id="header-text" placeholder="Header text (optional)"
        style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--bg);color:var(--text);outline:none;margin-bottom:6px">
      <input type="text" id="footer-text" placeholder="Footer text (optional)"
        style="width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--bg);color:var(--text);outline:none">
      <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);cursor:pointer">
        <input type="checkbox" id="page-numbers" checked style="accent-color:var(--accent)">
        Show page numbers
      </label>
    </div>
  </div>

  <!-- ── Editor + Actions ── -->
  <div class="editor-area">
    <div>
      <div class="editor-toolbar">
        <button class="tb-btn" onclick="wrapText('**','**')"><b>B</b></button>
        <button class="tb-btn" onclick="wrapText('_','_')"><i>I</i></button>
        <button class="tb-btn" onclick="insertLine('# ')">H1</button>
        <button class="tb-btn" onclick="insertLine('## ')">H2</button>
        <button class="tb-btn" onclick="insertLine('### ')">H3</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="insertLine('• ')">• List</button>
        <button class="tb-btn" onclick="insertLine('1. ')">1. List</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" onclick="insertLine('---')">― HR</button>
        <button class="tb-btn" onclick="insertLine('\n')">¶ Break</button>
        <div class="tb-sep"></div>
        <button class="tb-btn" style="color:var(--muted)" onclick="clearAll()">✕ Clear</button>
      </div>
      <input class="title-input" id="doc-title" type="text" placeholder="Document title (optional)">
      <textarea class="text-editor" id="text-editor"
        placeholder="Type or paste your text here…&#10;&#10;Supports basic formatting:&#10;  # Heading 1  ## Heading 2  ### Heading 3&#10;  **bold**  _italic_&#10;  • bullet  1. numbered&#10;  --- for a horizontal rule&#10;  Blank line = paragraph break"></textarea>
    </div>

    <div class="action-row">
      <button class="btn" id="btn-clear-all">✕ Clear All</button>
      <div style="flex:1"></div>
      <button class="btn" id="btn-preview2">👁 Preview</button>
      <button class="btn primary" id="btn-download2">⬇ Download PDF</button>
    </div>

    <div id="preview-section" style="display:none">
      <div class="preview-wrap">
        <div class="preview-header">
          <span>Preview</span>
          <span id="page-count-label" style="font-size:11px;color:var(--muted)"></span>
        </div>
        <iframe id="preview-frame"></iframe>
        <div class="word-count" id="word-count-bar">
          <div class="wc-item">Words: <span id="wc-words">0</span></div>
          <div class="wc-item">Characters: <span id="wc-chars">0</span></div>
          <div class="wc-item">Lines: <span id="wc-lines">0</span></div>
          <div class="wc-item">Est. pages: <span id="wc-pages">1</span></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const { jsPDF } = window.jspdf;

// ── Settings state ──
const settings = {
  pageSize: 'letter',
  orientation: 'portrait',
  fontFamily: 'helvetica',
  fontSize: 12,
  lineSpacing: 16,
  margin: 20,
  textColor: '#1a1a18',
  bgColor: '#ffffff',
  titleColor: '#1a1a18',
  header: '',
  footer: '',
  pageNumbers: true
};

// ── Seg buttons ──
document.querySelectorAll('[data-page]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-page]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    settings.pageSize = btn.dataset.page;
  });
});
document.querySelectorAll('[data-orient]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-orient]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    settings.orientation = btn.dataset.orient;
  });
});

// ── Inputs ──
document.getElementById('font-family').addEventListener('change', e => settings.fontFamily = e.target.value);

document.getElementById('font-size').addEventListener('input', function() {
  settings.fontSize = +this.value;
  document.getElementById('font-size-val').textContent = this.value + 'pt';
});
document.getElementById('line-spacing').addEventListener('input', function() {
  settings.lineSpacing = +this.value;
  const ratio = (this.value / settings.fontSize).toFixed(1);
  document.getElementById('line-spacing-val').textContent = ratio + '×';
});
document.getElementById('margin').addEventListener('input', function() {
  settings.margin = +this.value;
  document.getElementById('margin-val').textContent = this.value + 'mm';
});
document.getElementById('text-color').addEventListener('input', e => settings.textColor = e.target.value);
document.getElementById('bg-color').addEventListener('input', e => settings.bgColor = e.target.value);
document.getElementById('title-color').addEventListener('input', e => settings.titleColor = e.target.value);
document.getElementById('header-text').addEventListener('input', e => settings.header = e.target.value);
document.getElementById('footer-text').addEventListener('input', e => settings.footer = e.target.value);
document.getElementById('page-numbers').addEventListener('change', e => settings.pageNumbers = e.target.checked);

// ── Editor helpers ──
function wrapText(before, after) {
  const ta = document.getElementById('text-editor');
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.substring(start, end) || 'text';
  ta.setRangeText(before + sel + after, start, end, 'end');
  ta.focus();
}
function insertLine(prefix) {
  const ta = document.getElementById('text-editor');
  const start = ta.selectionStart;
  const lineStart = ta.value.lastIndexOf('\n', start - 1) + 1;
  ta.setRangeText(prefix, lineStart, lineStart, 'end');
  ta.focus();
}
function clearAll() {
  if (confirm('Clear editor content?')) {
    document.getElementById('text-editor').value = '';
    document.getElementById('doc-title').value = '';
    updateWordCount();
  }
}
document.getElementById('btn-clear-all').addEventListener('click', clearAll);

// ── Word count ──
function updateWordCount() {
  const text = document.getElementById('text-editor').value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const chars = text.length;
  const lines = text.split('\n').length;
  const pages = Math.max(1, Math.ceil(words / 250));
  document.getElementById('wc-words').textContent = words;
  document.getElementById('wc-chars').textContent = chars;
  document.getElementById('wc-lines').textContent = lines;
  document.getElementById('wc-pages').textContent = pages;
}
document.getElementById('text-editor').addEventListener('input', updateWordCount);

// ── Parse simple markdown-ish formatting ──
function parseLines(rawText) {
  const lines = rawText.split('\n');
  const blocks = [];
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) {
      blocks.push({ type: 'space' });
    } else if (/^#{1}\s/.test(trimmed)) {
      blocks.push({ type: 'h1', text: trimmed.slice(2).trim() });
    } else if (/^#{2}\s/.test(trimmed)) {
      blocks.push({ type: 'h2', text: trimmed.slice(3).trim() });
    } else if (/^#{3}\s/.test(trimmed)) {
      blocks.push({ type: 'h3', text: trimmed.slice(4).trim() });
    } else if (/^---+$/.test(trimmed)) {
      blocks.push({ type: 'hr' });
    } else if (/^[•\-\*]\s/.test(trimmed)) {
      blocks.push({ type: 'bullet', text: trimmed.slice(2).trim() });
    } else if (/^\d+\.\s/.test(trimmed)) {
      const num = trimmed.match(/^(\d+)\./)[1];
      blocks.push({ type: 'numbered', text: trimmed.slice(num.length + 2).trim(), num: +num });
    } else {
      blocks.push({ type: 'para', text: trimmed });
    }
  }
  return blocks;
}

// Strip bold/italic markers for PDF (jsPDF doesn't natively support inline bold)
function stripInline(text) {
  return text.replace(/\*\*(.*?)\*\*/g, '$1').replace(/_(.*?)_/g, '$1');
}

// ── Build PDF ──
function buildPDF() {
  const titleText = document.getElementById('doc-title').value.trim();
  const bodyText  = document.getElementById('text-editor').value;

  const pageSizeMap = { letter: 'letter', a4: 'a4', legal: 'legal' };
  const doc = new jsPDF({
    orientation: settings.orientation,
    unit: 'mm',
    format: pageSizeMap[settings.pageSize] || 'letter'
  });

  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const m = settings.margin;
  const contentW = pageW - m * 2;
  let y = m;

  // helper: hex to [r,g,b]
  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return [r,g,b];
  }

  // Background
  const bgRgb = hexToRgb(settings.bgColor);
  const textRgb = hexToRgb(settings.textColor);
  const titleRgb = hexToRgb(settings.titleColor);

  function fillBg() {
    doc.setFillColor(...bgRgb);
    doc.rect(0, 0, pageW, pageH, 'F');
  }

  function addHeaderFooter(pageNum, totalPages) {
    doc.setFont(settings.fontFamily, 'normal');
    doc.setFontSize(8);
    doc.setTextColor(150, 150, 150);
    if (settings.header) {
      doc.text(settings.header, pageW / 2, 8, { align: 'center' });
    }
    if (settings.footer) {
      doc.text(settings.footer, pageW / 2, pageH - 5, { align: 'center' });
    }
    if (settings.pageNumbers) {
      doc.text(`${pageNum}`, pageW - m, pageH - 5, { align: 'right' });
    }
  }

  let currentPage = 1;
  fillBg();

  // Draw header/footer on page 1 after we know total pages (done at end)
  function checkNewPage(needed) {
    const footerSpace = (settings.footer || settings.pageNumbers) ? 10 : 5;
    if (y + needed > pageH - m - footerSpace) {
      doc.addPage();
      currentPage++;
      fillBg();
      y = m + (settings.header ? 12 : 0);
      return true;
    }
    return false;
  }

  const ls = settings.lineSpacing;

  // Title
  if (titleText) {
    doc.setFont(settings.fontFamily, 'bold');
    doc.setFontSize(settings.fontSize + 8);
    doc.setTextColor(...titleRgb);
    const lines = doc.splitTextToSize(titleText, contentW);
    checkNewPage(lines.length * (ls + 4) + 6);
    y += settings.header ? 12 : 4;
    doc.text(lines, m, y);
    y += lines.length * (ls + 4) + 4;
    // underline
    doc.setDrawColor(...titleRgb);
    doc.setLineWidth(0.4);
    doc.line(m, y, m + contentW, y);
    y += 6;
  } else {
    y += settings.header ? 14 : 0;
  }

  // Body
  const blocks = parseLines(bodyText);
  doc.setTextColor(...textRgb);

  for (const block of blocks) {
    if (block.type === 'space') {
      y += ls * 0.4;
      continue;
    }
    if (block.type === 'hr') {
      checkNewPage(6);
      doc.setDrawColor(200,200,200);
      doc.setLineWidth(0.3);
      doc.line(m, y + 2, m + contentW, y + 2);
      y += 6;
      continue;
    }
    if (block.type === 'h1') {
      const sz = settings.fontSize + 6;
      doc.setFont(settings.fontFamily, 'bold');
      doc.setFontSize(sz);
      const lines = doc.splitTextToSize(stripInline(block.text), contentW);
      checkNewPage(lines.length * (sz * 0.5) + 8);
      y += 4;
      doc.text(lines, m, y);
      y += lines.length * (sz * 0.5) + 4;
      continue;
    }
    if (block.type === 'h2') {
      const sz = settings.fontSize + 4;
      doc.setFont(settings.fontFamily, 'bold');
      doc.setFontSize(sz);
      const lines = doc.splitTextToSize(stripInline(block.text), contentW);
      checkNewPage(lines.length * (sz * 0.45) + 6);
      y += 3;
      doc.text(lines, m, y);
      y += lines.length * (sz * 0.45) + 3;
      continue;
    }
    if (block.type === 'h3') {
      const sz = settings.fontSize + 2;
      doc.setFont(settings.fontFamily, 'bold');
      doc.setFontSize(sz);
      const lines = doc.splitTextToSize(stripInline(block.text), contentW);
      checkNewPage(lines.length * (sz * 0.45) + 4);
      y += 2;
      doc.text(lines, m, y);
      y += lines.length * (sz * 0.45) + 2;
      continue;
    }
    if (block.type === 'bullet') {
      doc.setFont(settings.fontFamily, 'normal');
      doc.setFontSize(settings.fontSize);
      const indent = 6;
      const lines = doc.splitTextToSize(stripInline(block.text), contentW - indent);
      checkNewPage(lines.length * ls + 2);
      doc.text('•', m, y);
      doc.text(lines, m + indent, y);
      y += lines.length * ls + 1;
      continue;
    }
    if (block.type === 'numbered') {
      doc.setFont(settings.fontFamily, 'normal');
      doc.setFontSize(settings.fontSize);
      const indent = 8;
      const lines = doc.splitTextToSize(stripInline(block.text), contentW - indent);
      checkNewPage(lines.length * ls + 2);
      doc.text(block.num + '.', m, y);
      doc.text(lines, m + indent, y);
      y += lines.length * ls + 1;
      continue;
    }
    // para
    doc.setFont(settings.fontFamily, 'normal');
    doc.setFontSize(settings.fontSize);
    const lines = doc.splitTextToSize(stripInline(block.text), contentW);
    checkNewPage(lines.length * ls + 2);
    doc.text(lines, m, y);
    y += lines.length * ls + 2;
  }

  // Add header/footer to all pages
  const totalPages = doc.getNumberOfPages();
  for (let p = 1; p <= totalPages; p++) {
    doc.setPage(p);
    addHeaderFooter(p, totalPages);
  }

  return doc;
}

// ── Preview ──
function showPreview() {
  const doc = buildPDF();
  const blob = doc.output('blob');
  const url = URL.createObjectURL(blob);
  const frame = document.getElementById('preview-frame');
  frame.src = url;
  document.getElementById('preview-section').style.display = 'block';
  document.getElementById('page-count-label').textContent =
    doc.getNumberOfPages() + ' page' + (doc.getNumberOfPages() > 1 ? 's' : '');
  updateWordCount();
  frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Download ──
function downloadPDF() {
  const doc = buildPDF();
  const title = document.getElementById('doc-title').value.trim() || 'document';
  const filename = title.replace(/[^a-z0-9]/gi, '_').toLowerCase() + '.pdf';
  doc.save(filename);
}

document.getElementById('btn-preview').addEventListener('click', showPreview);
document.getElementById('btn-preview2').addEventListener('click', showPreview);
document.getElementById('btn-download').addEventListener('click', downloadPDF);
document.getElementById('btn-download2').addEventListener('click', downloadPDF);

updateWordCount();
</script>
</body>
