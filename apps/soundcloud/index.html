<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dré Foreman · SoundCloud</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#111;--panel:#1a1a1a;--card:#222;--border:#333;
  --orange:#ff5500;--purple:#b366ff;--text:#fff;--dim:#aaa;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;}

header{
  background:linear-gradient(135deg,rgba(255,85,0,.12),rgba(179,102,255,.12));
  border-bottom:2px solid var(--border);
  padding:36px 20px 28px;text-align:center;
}
header h1{font-size:2rem;font-weight:700;background:linear-gradient(90deg,var(--orange),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
header p{color:var(--dim);margin-top:6px;font-size:.95rem;}
header .meta{display:flex;justify-content:center;gap:24px;margin-top:14px;font-size:.85rem;color:var(--dim);}
header .meta span{border:1px solid var(--border);padding:3px 12px;border-radius:20px;}

.controls{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:10;
}
.controls input{
  flex:1;min-width:180px;background:#111;border:1px solid var(--border);color:var(--text);
  padding:7px 14px;border-radius:20px;font-size:.85rem;outline:none;
}
.controls input:focus{border-color:var(--orange);}
.badge{font-size:.78rem;color:var(--dim);white-space:nowrap;}
.sort-btn{background:none;border:1px solid var(--border);color:var(--dim);padding:4px 12px;border-radius:12px;cursor:pointer;font-size:.78rem;transition:.15s;}
.sort-btn.active,.sort-btn:hover{border-color:var(--orange);color:var(--orange);}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:1px;background:var(--border);
  padding:0;
}
.card{
  background:var(--card);padding:0;overflow:hidden;
  display:flex;flex-direction:column;
  transition:background .15s;
}
.card:hover{background:#2a2a2a;}
.card-title{
  padding:10px 14px 4px;font-size:.9rem;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text);
}
.card-plays{padding:0 14px 8px;font-size:.75rem;color:var(--dim);}
.card iframe{width:100%;border:none;display:block;}

footer{text-align:center;padding:28px;color:var(--dim);font-size:.8rem;border-top:1px solid var(--border);}
</style>
</head>
<body>

<header>
  <h1>Dré Foreman</h1>
  <p>London, Canada · SoundCloud</p>
  <div class="meta">
    <span>71 tracks</span>
    <span>6 followers</span>
    <span>I love making beats what can i say.</span>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Search tracks…" oninput="filterTracks()">
  <span class="badge" id="count-badge">70 tracks</span>
  <button class="sort-btn active" id="sort-alpha" onclick="sortTracks('alpha')">A–Z</button>
  <button class="sort-btn" id="sort-plays" onclick="sortTracks('plays')">Most Played</button>
  <button class="sort-btn" id="sort-default" onclick="sortTracks('default')">Latest</button>
</div>

<div class="grid" id="grid"></div>

<footer>Dré Foreman on SoundCloud · <a href="https://soundcloud.com/dr-foreman" target="_blank" style="color:var(--orange)">soundcloud.com/dr-foreman</a></footer>

let sorted = [...TRACKS];
let currentSort = 'default';

function embedUrl(slug){
  return `https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/dr-foreman/${slug}&color=%23ff5500&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&show_teaser=false`;
}

function renderGrid(list){
  const grid = document.getElementById('grid');
  grid.innerHTML = list.map(t => `
    <div class="card" data-title="${t.title.toLowerCase()}">
      <div class="card-title" title="${t.title}">${t.title}</div>
      <div class="card-plays">▶ ${t.plays.toLocaleString()} plays</div>
      <iframe scrolling="no" frameborder="no" allow="autoplay"
        src="${embedUrl(t.slug)}"
        height="80"></iframe>
    </div>
  `).join('');
  document.getElementById('count-badge').textContent = list.length + ' tracks';
}

function filterTracks(){
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = sorted.filter(t => t.title.toLowerCase().includes(q));
  renderGrid(filtered);
}

function sortTracks(mode){
  currentSort = mode;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sort-'+mode).classList.add('active');
  if(mode === 'alpha') sorted = [...TRACKS].sort((a,b) => a.title.localeCompare(b.title));
  else if(mode === 'plays') sorted = [...TRACKS].sort((a,b) => b.plays - a.plays);
  else sorted = [...TRACKS];
  filterTracks();
}

// Initial render
renderGrid(sorted);
</script>
