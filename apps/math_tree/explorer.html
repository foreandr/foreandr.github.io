<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Tree Explorer</title>
  <link rel="icon" type="image/x-icon" href="../../images.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./explorer.css">
</head>
<body>
  <header class="topbar">
    <a class="back-btn" href="../../index.html">Back Home</a>
    <nav class="view-nav">
      <a class="view-link" href="./index.html">Studio</a>
      <a class="view-link active" href="./explorer.html">Explorer</a>
      <a class="view-link" href="./galaxy.html">Galaxy</a>
    </nav>
    <input id="search-input" type="text" placeholder="Focus node (name or id)">
  </header>

  <main id="main">
    <section id="viewport">
      <div id="canvas">
        <svg id="edges"></svg>
        <div id="nodes"></div>
      </div>
    </section>
    <aside id="sidebar">
      <h2>Dependency Trace</h2>
      <p class="muted">Click a node to highlight every requirement back to foundations.</p>
      <div id="trace-list"></div>
    </aside>
  </main>

  <script src="./data.js"></script>
  <script src="./core.js"></script>
  <script src="./explorer.js"></script>
</body>
</html>
