<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Person Content Dashboard</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: Arial, sans-serif; margin: 0; background: #111; color: #f5f5f5; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
    input, button { padding: 10px 12px; border-radius: 8px; border: 1px solid #444; background: #1c1c1c; color: white; }
    button { cursor: pointer; }
    .grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
    .panel { background: #1a1a1a; border: 1px solid #2b2b2b; border-radius: 12px; padding: 16px; }
    .letter-filter { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 6px; margin-bottom: 12px; }
    .letter-filter button { min-height: 34px; padding: 6px 0; border-radius: 6px; font-size: 12px; }
    .letter-filter button.active { border-color: #7aa2ff; background: #2a3550; }
    .people-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .people-heading h3 { margin: 0; }
    .subtle { color: #999; font-size: 12px; }
    .people-list { display: flex; flex-direction: column; gap: 8px; max-height: 65vh; overflow: auto; }
    .person-chip { padding: 10px; border-radius: 8px; background: #222; cursor: pointer; border: 1px solid transparent; }
    .person-chip.active { border-color: #7aa2ff; background: #2a3550; }
    .video-card { margin-bottom: 14px; padding: 14px; background: #171717; border: 1px solid #2d2d2d; border-radius: 10px; }
    .video-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .meta { color: #aaa; font-size: 12px; margin-bottom: 8px; }
    .pill { display: inline-block; background: #26364e; color: #8fc1ff; padding: 4px 8px; border-radius: 999px; font-size: 12px; margin-right: 6px; margin-bottom: 6px; }
    .word-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    iframe { width: 100%; height: 220px; border: 0; border-radius: 8px; margin-top: 8px; }
    .empty { color: #999; font-style: italic; }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; color: #bbb; }
    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
      input { min-width: 0 !important; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h2 style="margin:0;">Person Content Dashboard</h2>
      <input id="searchInput" style="min-width: 320px;" placeholder="Search by person, video, or transcript word" />
      <button onclick="runSearch()">Search</button>
      <button onclick="resetView()">Reset</button>
    </div>

    <div class="stats">
      <span id="videoCount">0 videos</span>
      <span id="personCount">0 people</span>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="people-heading">
          <h3>People</h3>
          <span id="visiblePeopleCount" class="subtle">0 shown</span>
        </div>
        <div id="letterFilter" class="letter-filter"></div>
        <div id="peopleList" class="people-list"></div>
      </div>

      <div class="panel">
        <div id="detailPanel"></div>
        <div id="resultsPanel"></div>
      </div>
    </div>
  </div>

  <script>
    let allData = { videos: [], people: [] };
    let selectedPerson = null;
    let selectedLetter = 'A';

    async function loadData() {
      const response = await fetch('./person_content_data.json');
      const data = await response.json();
      allData = data;
      selectedLetter = getFirstPopulatedLetter();
      renderLetterFilter();
      renderPeople();
      renderResults(data.videos, 'All videos');
      updateStats();
    }

    function updateStats() {
      document.getElementById('videoCount').textContent = `${allData.videos.length} videos`;
      document.getElementById('personCount').textContent = `${allData.people.length} people`;
    }

    function renderLetterFilter() {
      const filter = document.getElementById('letterFilter');
      const letters = ['All', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''), '#'];
      filter.innerHTML = letters.map(letter => {
        const active = selectedLetter === letter ? 'active' : '';
        return `<button class="${active}" onclick="selectLetter('${letter}')">${letter}</button>`;
      }).join('');
    }

    function selectLetter(letter) {
      selectedLetter = letter;
      renderLetterFilter();
      renderPeople();
    }

    function renderPeople() {
      const list = document.getElementById('peopleList');
      const people = getVisiblePeople();
      document.getElementById('visiblePeopleCount').textContent = `${people.length} shown`;
      list.innerHTML = '';

      if (!people.length) {
        list.innerHTML = '<div class="empty">No people under this letter.</div>';
        return;
      }

      people.forEach(person => {
        const div = document.createElement('div');
        div.className = `person-chip ${selectedPerson && selectedPerson.id === person.id ? 'active' : ''}`;
        div.innerHTML = `<strong>${escapeHtml(person.name)}</strong>`;
        div.onclick = () => {
          selectedPerson = person;
          document.getElementById('searchInput').value = '';
          renderPeople();
          renderPersonResults(person);
        };
        list.appendChild(div);
      });
    }

    function getVisiblePeople() {
      if (selectedLetter === 'All') {
        return allData.people.slice(0, 500);
      }
      if (selectedLetter === '#') {
        return allData.people.filter(person => !/^[a-z]/i.test(person.name));
      }
      return allData.people.filter(person => person.name.toUpperCase().startsWith(selectedLetter));
    }

    function getFirstPopulatedLetter() {
      const firstPerson = allData.people.find(person => /^[a-z]/i.test(person.name));
      return firstPerson ? firstPerson.name[0].toUpperCase() : 'All';
    }

    function getPersonVideos(person) {
      return allData.videos.filter(video => video.people.some(p => p.person_id === person.id));
    }

    function renderPersonResults(person) {
      const videos = getPersonVideos(person);
      const detail = document.getElementById('detailPanel');
      detail.innerHTML = `
        <h3 style="margin-top:0;">${escapeHtml(person.name)}</h3>
        <p>${videos.length} related videos</p>
      `;
      renderResults(videos, `${person.name}'s videos`);
    }

    function renderResults(videos, heading = 'Videos') {
      const resultsPanel = document.getElementById('resultsPanel');
      if (!videos.length) {
        resultsPanel.innerHTML = `<h3 style="margin-top:0;">${escapeHtml(heading)}</h3><div class="empty">No results.</div>`;
        return;
      }

      resultsPanel.innerHTML = `
        <h3 style="margin-top:0;">${escapeHtml(heading)}</h3>
        <p class="subtle">${videos.length} matching videos${videos.length > 30 ? ' - showing first 30' : ''}</p>
        ${videos.slice(0, 30).map(video => `
          <div class="video-card">
            <div class="video-title">${escapeHtml(video.title)}</div>
            <div class="meta">${escapeHtml(video.channel.title || video.channel.url || '')}</div>
            <div class="meta">People: ${video.people.map(p => escapeHtml(p.name)).join(', ')}</div>
            <div class="word-list">
              ${(video.top_words || []).slice(0, 8).map(w => `<span class="pill">${escapeHtml(w.word)} x ${w.count}</span>`).join('')}
            </div>
            <iframe src="https://www.youtube.com/embed/${video.youtube_id}" title="${escapeHtml(video.title)}"></iframe>
          </div>
        `).join('')}
      `;
    }

    function runSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      selectedPerson = null;
      document.getElementById('detailPanel').innerHTML = '';
      renderPeople();

      if (!query) {
        renderResults(allData.videos, 'All videos');
        return;
      }

      const filtered = allData.videos.filter(video => {
        const haystack = [
          video.title,
          video.channel.title,
          video.channel.owner_name,
          video.people.map(p => p.name).join(' '),
          (video.top_words || []).map(w => w.word).join(' '),
          video.search_text || ''
        ].join(' ').toLowerCase();
        return haystack.includes(query);
      });

      renderResults(filtered, `Search: ${query}`);
    }

    function resetView() {
      document.getElementById('searchInput').value = '';
      selectedPerson = null;
      selectedLetter = getFirstPopulatedLetter();
      renderLetterFilter();
      renderPeople();
      renderResults(allData.videos, 'All videos');
      document.getElementById('detailPanel').innerHTML = '';
    }

    function escapeHtml(text) {
      return String(text || '').replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    loadData();
  </script>
</body>
</html>
