<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Muscle Workout Planner</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #080c12; color: #e8e8e8; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; }
#app { display: flex; height: 100vh; }
#viewer { flex: 1; position: relative; }
#three-canvas { display: block; width: 100%; height: 100%; }
#hover-label {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.75); color: #ff6b35; padding: 6px 14px;
  border-radius: 20px; font-size: 13px; font-weight: 600; pointer-events: none;
  display: none; border: 1px solid rgba(255,107,53,0.4); letter-spacing: 0.5px;
}
#hint {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  color: rgba(255,255,255,0.35); font-size: 12px; pointer-events: none;
  text-align: center; line-height: 1.8;
}
#view-btns {
  position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 8px;
}
.view-btn {
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7); padding: 6px 16px; border-radius: 20px;
  cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
  transition: all 0.2s;
}
.view-btn:hover, .view-btn.active { background: rgba(255,107,53,0.2); border-color: #ff6b35; color: #ff6b35; }
#panel {
  width: 380px; background: #0d1117; border-left: 1px solid rgba(255,255,255,0.08);
  display: flex; flex-direction: column; overflow: hidden;
}
#panel-header {
  padding: 20px 22px 16px; border-bottom: 1px solid rgba(255,255,255,0.07);
  flex-shrink: 0;
}
#panel-header h1 { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 2px; }
#panel-header p { font-size: 12px; color: rgba(255,255,255,0.4); }
#muscle-info { flex: 1; overflow-y: auto; padding: 20px 22px; }
#muscle-info::-webkit-scrollbar { width: 4px; }
#muscle-info::-webkit-scrollbar-track { background: transparent; }
#muscle-info::-webkit-scrollbar-thumb { background: rgba(255,107,53,0.3); border-radius: 2px; }
#empty-state {
  height: 100%; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 40px 20px;
}
#empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
#empty-state h3 { font-size: 15px; color: rgba(255,255,255,0.5); margin-bottom: 8px; }
#empty-state p { font-size: 13px; color: rgba(255,255,255,0.28); line-height: 1.6; }
.muscle-name { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 4px; }
.muscle-group-tag {
  display: inline-block; background: rgba(255,107,53,0.15); color: #ff6b35;
  padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.5px; margin-bottom: 16px; border: 1px solid rgba(255,107,53,0.3);
}
.section-title {
  font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: rgba(255,255,255,0.35);
  text-transform: uppercase; margin: 20px 0 10px;
}
.exercise-card {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px; padding: 13px 15px; margin-bottom: 8px; cursor: pointer;
  transition: all 0.2s;
}
.exercise-card:hover { background: rgba(255,107,53,0.08); border-color: rgba(255,107,53,0.3); }
.exercise-card.expanded { border-color: rgba(255,107,53,0.4); background: rgba(255,107,53,0.07); }
.ex-name { font-size: 14px; font-weight: 600; color: #e8e8e8; margin-bottom: 4px; }
.ex-rec { font-size: 12px; color: #ff6b35; font-weight: 600; }
.ex-meta { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.ex-tag {
  font-size: 10px; padding: 2px 8px; border-radius: 8px;
  font-weight: 600; letter-spacing: 0.3px;
}
.ex-tag.equipment { background: rgba(100,160,255,0.15); color: #6fa0ff; border: 1px solid rgba(100,160,255,0.2); }
.ex-tag.difficulty-beginner { background: rgba(100,220,120,0.15); color: #64dc78; border: 1px solid rgba(100,220,120,0.2); }
.ex-tag.difficulty-intermediate { background: rgba(255,180,50,0.15); color: #ffb432; border: 1px solid rgba(255,180,50,0.2); }
.ex-tag.difficulty-advanced { background: rgba(255,80,80,0.15); color: #ff5050; border: 1px solid rgba(255,80,80,0.2); }
.ex-tip { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 8px; line-height: 1.5; display: none; }
.exercise-card.expanded .ex-tip { display: block; }
.ex-arrow { float: right; color: rgba(255,255,255,0.3); font-size: 12px; margin-top: 2px; }
.exercise-card.expanded .ex-arrow { color: #ff6b35; }
</style>
</head>
<body>
<div id="app">
  <div id="viewer">
    <canvas id="three-canvas"></canvas>
    <div id="hover-label"></div>
    <div id="view-btns">
      <button class="view-btn active" onclick="setView('front')">FRONT</button>
      <button class="view-btn" onclick="setView('back')">BACK</button>
      <button class="view-btn" onclick="setView('side')">SIDE</button>
    </div>
    <div id="hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Click a muscle to explore exercises</div>
  </div>
  <div id="panel">
    <div id="panel-header">
      <h1>💪 Workout Planner</h1>
      <p>Select any muscle on the body to view exercises</p>
    </div>
    <div id="muscle-info">
      <div id="empty-state">
        <div class="icon">🫀</div>
        <h3>No muscle selected</h3>
        <p>Click on any muscle on the 3D body to see targeted exercises, tips, and recommendations.</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

// ═══════════════════════════════════════════════════════
// THREE.JS SETUP
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('three-canvas');
const container = document.getElementById('viewer');
const W = () => container.clientWidth;
const H = () => container.clientHeight;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setSize(W(), H());

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080c12);
scene.fog = new THREE.FogExp2(0x080c12, 0.18);

const camera = new THREE.PerspectiveCamera(45, W() / H(), 0.05, 50);
camera.position.set(0, 0.3, 3.8);

// ─── LIGHTING ───
const ambient = new THREE.AmbientLight(0x1a0a0a, 0.8);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffddc0, 1.4);
keyLight.position.set(-2, 4, 3);
keyLight.castShadow = true;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xa0c4ff, 0.5);
fillLight.position.set(3, 1, 2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xff8060, 0.6);
rimLight.position.set(0, -2, -4);
scene.add(rimLight);

const topLight = new THREE.DirectionalLight(0xffffff, 0.3);
topLight.position.set(0, 5, 0);
scene.add(topLight);

// ─── BODY GROUP ───
const bodyGroup = new THREE.Group();
scene.add(bodyGroup);

// ─── SKELETON (base body structure) ───
function addSkeleton() {
  const skMat = new THREE.MeshPhongMaterial({ color: 0x1a1a2e, specular: 0x111133, shininess: 10, transparent: true, opacity: 0.85 });
  const parts = [
    // Head
    { geo: new THREE.SphereGeometry(0.13, 16, 12), pos: [0, 1.44, 0] },
    // Neck
    { geo: new THREE.CylinderGeometry(0.055, 0.065, 0.15, 12), pos: [0, 1.24, 0] },
    // Upper torso
    { geo: new THREE.CylinderGeometry(0.28, 0.22, 0.45, 16), pos: [0, 0.85, 0] },
    // Lower torso / abs
    { geo: new THREE.CylinderGeometry(0.22, 0.20, 0.38, 16), pos: [0, 0.40, 0] },
    // Pelvis
    { geo: new THREE.CylinderGeometry(0.22, 0.20, 0.25, 16), pos: [0, 0.06, 0] },
    // Upper arm L
    { geo: new THREE.CylinderGeometry(0.075, 0.065, 0.42, 10), pos: [-0.60, 0.64, 0], rot: [0, 0, 0.06] },
    { geo: new THREE.CylinderGeometry(0.075, 0.065, 0.42, 10), pos: [0.60, 0.64, 0], rot: [0, 0, -0.06] },
    // Lower arm L/R
    { geo: new THREE.CylinderGeometry(0.060, 0.045, 0.40, 10), pos: [-0.64, 0.20, 0] },
    { geo: new THREE.CylinderGeometry(0.060, 0.045, 0.40, 10), pos: [0.64, 0.20, 0] },
    // Hand L/R
    { geo: new THREE.SphereGeometry(0.045, 8, 6), pos: [-0.64, -0.04, 0] },
    { geo: new THREE.SphereGeometry(0.045, 8, 6), pos: [0.64, -0.04, 0] },
    // Upper leg L/R
    { geo: new THREE.CylinderGeometry(0.140, 0.115, 0.72, 12), pos: [-0.15, -0.72, 0] },
    { geo: new THREE.CylinderGeometry(0.140, 0.115, 0.72, 12), pos: [0.15, -0.72, 0] },
    // Lower leg L/R
    { geo: new THREE.CylinderGeometry(0.090, 0.065, 0.62, 12), pos: [-0.13, -1.42, 0] },
    { geo: new THREE.CylinderGeometry(0.090, 0.065, 0.62, 12), pos: [0.13, -1.42, 0] },
    // Foot L/R
    { geo: new THREE.BoxGeometry(0.10, 0.05, 0.18), pos: [-0.13, -1.80, 0.05] },
    { geo: new THREE.BoxGeometry(0.10, 0.05, 0.18), pos: [0.13, -1.80, 0.05] },
  ];
  parts.forEach(p => {
    const mesh = new THREE.Mesh(p.geo, skMat);
    mesh.position.set(...p.pos);
    if (p.rot) mesh.rotation.set(...p.rot);
    bodyGroup.add(mesh);
  });
}
addSkeleton();

// ─── MUSCLE MESHES ───
const muscleMeshes = [];
const defaultMat = (color) => new THREE.MeshPhongMaterial({
  color: color,
  specular: new THREE.Color(0.4, 0.2, 0.2),
  shininess: 55,
  emissive: new THREE.Color(color).multiplyScalar(0.08),
});
const hoverMat = (color) => new THREE.MeshPhongMaterial({
  color: new THREE.Color(color).lerp(new THREE.Color(0xffffff), 0.3),
  specular: new THREE.Color(1, 0.8, 0.6),
  shininess: 80,
  emissive: new THREE.Color(color).multiplyScalar(0.25),
});
const selectedMat = new THREE.MeshPhongMaterial({
  color: 0xffaa00,
  specular: new THREE.Color(1, 0.9, 0.5),
  shininess: 100,
  emissive: new THREE.Color(0x553300),
});

const geo = new THREE.SphereGeometry(1, 24, 18);

MUSCLE_DEFS.forEach(def => {
  const mat = defaultMat(def.color);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(...def.pos);
  if (def.rot) mesh.rotation.set(...def.rot);
  mesh.scale.set(...def.scale);
  mesh.userData = { ...def, defaultColor: def.color };
  bodyGroup.add(mesh);
  muscleMeshes.push(mesh);
});

// ─── RAYCASTING ───
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredMesh = null;
let selectedMesh = null;
const hoverLabel = document.getElementById('hover-label');

function getMouseNDC(e) {
  const rect = canvas.getBoundingClientRect();
  return new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
}

canvas.addEventListener('mousemove', (e) => {
  if (isDragging) return;
  const ndc = getMouseNDC(e);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(muscleMeshes);
  if (hoveredMesh && hoveredMesh !== selectedMesh) {
    hoveredMesh.material = defaultMat(hoveredMesh.userData.defaultColor);
  }
  if (hits.length > 0) {
    const h = hits[0].object;
    if (h !== selectedMesh) h.material = hoverMat(h.userData.defaultColor);
    hoveredMesh = h;
    hoverLabel.style.display = 'block';
    hoverLabel.textContent = h.userData.name;
    canvas.style.cursor = 'pointer';
  } else {
    hoveredMesh = null;
    hoverLabel.style.display = 'none';
    canvas.style.cursor = 'default';
  }
});

canvas.addEventListener('click', (e) => {
  if (wasDragging) { wasDragging = false; return; }
  const ndc = getMouseNDC(e);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(muscleMeshes);
  if (selectedMesh) {
    selectedMesh.material = defaultMat(selectedMesh.userData.defaultColor);
    selectedMesh = null;
  }
  if (hits.length > 0) {
    selectedMesh = hits[0].object;
    selectedMesh.material = selectedMat;
    showMuscleInfo(selectedMesh.userData);
  } else {
    showEmptyState();
  }
});

// ─── ORBIT CONTROLS (manual) ───
let isDragging = false, wasDragging = false;
let prevMouse = { x: 0, y: 0 };
let rotX = 0, rotY = 0;
let targetRotX = 0, targetRotY = 0;
let zoom = 3.8, targetZoom = 3.8;

canvas.addEventListener('mousedown', (e) => {
  isDragging = true;
  wasDragging = false;
  prevMouse = { x: e.clientX, y: e.clientY };
});
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) wasDragging = true;
  targetRotY += dx * 0.008;
  targetRotX += dy * 0.008;
  targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX));
  prevMouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetZoom += e.deltaY * 0.004;
  targetZoom = Math.max(1.2, Math.min(6.0, targetZoom));
}, { passive: false });

// Touch support
let lastTouch = null;
canvas.addEventListener('touchstart', (e) => {
  isDragging = true;
  wasDragging = false;
  lastTouch = e.touches[0];
});
canvas.addEventListener('touchend', () => { isDragging = false; });
canvas.addEventListener('touchmove', (e) => {
  if (!isDragging || !lastTouch) return;
  e.preventDefault();
  const t = e.touches[0];
  const dx = t.clientX - lastTouch.clientX;
  const dy = t.clientY - lastTouch.clientY;
  wasDragging = true;
  targetRotY += dx * 0.01;
  targetRotX += dy * 0.01;
  targetRotX = Math.max(-1.2, Math.min(1.2, targetRotX));
  lastTouch = t;
}, { passive: false });

// View presets
function setView(v) {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (v === 'front') { targetRotY = 0; targetRotX = 0; }
  else if (v === 'back') { targetRotY = Math.PI; targetRotX = 0; }
  else if (v === 'side') { targetRotY = Math.PI / 2; targetRotX = 0; }
}

// ─── UI ───
function showEmptyState() {
  document.getElementById('muscle-info').innerHTML = `
    <div id="empty-state">
      <div class="icon">🫀</div>
      <h3>No muscle selected</h3>
      <p>Click on any muscle on the 3D body to see targeted exercises, tips, and recommendations.</p>
    </div>`;
}

function showMuscleInfo(data) {
  const exercises = EXERCISES[data.exKey] || [];
  const exHTML = exercises.map((ex, i) => `
    <div class="exercise-card" onclick="toggleEx(this)">
      <span class="ex-arrow">▼</span>
      <div class="ex-name">${ex.name}</div>
      <div class="ex-rec">${ex.rec}</div>
      <div class="ex-meta">
        <span class="ex-tag equipment">${ex.equipment}</span>
        <span class="ex-tag difficulty-${ex.difficulty}">${ex.difficulty}</span>
      </div>
      <div class="ex-tip">${ex.tip}</div>
    </div>
  `).join('');

  document.getElementById('muscle-info').innerHTML = `
    <div class="muscle-name">${data.name}</div>
    <span class="muscle-group-tag">${data.group}</span>
    <div class="section-title">Exercises (${exercises.length})</div>
    ${exHTML}
  `;
}

function toggleEx(el) {
  el.classList.toggle('expanded');
}

// ─── ANIMATION ───
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  rotX += (targetRotX - rotX) * 0.12;
  rotY += (targetRotY - rotY) * 0.12;
  zoom += (targetZoom - zoom) * 0.10;

  bodyGroup.rotation.x = rotX;
  bodyGroup.rotation.y = rotY;
  camera.position.z = zoom;

  // Gentle breathing bob
  const t = clock.getElapsedTime();
  bodyGroup.position.y = Math.sin(t * 0.7) * 0.008;

  renderer.render(scene, camera);
}
animate();

// ─── RESIZE ───
window.addEventListener('resize', () => {
  renderer.setSize(W(), H());
  camera.aspect = W() / H();
  camera.updateProjectionMatrix();
});
</script>
