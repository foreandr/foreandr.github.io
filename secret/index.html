<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Apps</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #111a33;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #24314f;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at top, #1a2452 0%, var(--bg) 50%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 32px 20px;
    }
    .wrap {
      width: 100%;
      max-width: 980px;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: -0.01em;
    }
    .header p {
      margin: 0;
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.08), transparent 40%), var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      transition: transform 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #435786;
      background-color: #152144;
    }
    .tag {
      font-size: 0.75rem;
      color: #c4b5fd;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .title {
      margin: 0 0 6px;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .desc {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .back-link {
      display: inline-block;
      margin-top: 22px;
      color: #ddd6fe;
      text-decoration: none;
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 999px;
      transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
    }
    .back-link:hover {
      border-color: var(--accent);
      color: #f5f3ff;
      background: rgba(124, 58, 237, 0.15);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <h1>Secret Apps</h1>
      <p>Direct access only. These apps are intentionally not listed on the homepage.</p>
    </header>

    <section class="grid" aria-label="Secret apps list">
      <a href="../apps/reddit_fetish_tracker/index.html" class="card">
        <div class="tag">Locked</div>
        <h2 class="title">Reddit Fetish Tracker</h2>
        <p class="desc">Password protected.</p>
      </a>

      <a href="../apps/manhwa_manga/index.html" class="card">
        <div class="tag">Locked</div>
        <h2 class="title">Manhwa Manga</h2>
        <p class="desc">Password protected.</p>
      </a>
    </section>

    <a class="back-link" href="../index.html">Back to Home</a>
  </main>
</body>
</html>
